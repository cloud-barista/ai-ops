basePath: /
definitions:
  applicationprofile.AcceleratorRequirements:
    properties:
      count_min:
        type: integer
      memory_mib_min_per_device:
        type: integer
      required:
        type: boolean
      type:
        type: string
    required:
    - count_min
    - memory_mib_min_per_device
    - required
    type: object
  applicationprofile.AnalysisEvidence:
    properties:
      actual_model:
        type: string
      attempts:
        type: integer
      candidate_id:
        type: string
      fallback_reason:
        type: string
      latency_ms:
        type: integer
      mode:
        type: string
      provider:
        type: string
      selection_policy:
        type: string
    required:
    - mode
    type: object
  applicationprofile.AnalysisSummary:
    properties:
      assumptions:
        items:
          type: string
        type: array
      confidence:
        type: number
      missing_fields:
        items:
          type: string
        type: array
      warnings:
        items:
          type: string
        type: array
    required:
    - confidence
    type: object
  applicationprofile.ApplicationMetadata:
    properties:
      app_id:
        type: string
      app_version:
        type: string
      artifact:
        $ref: '#/definitions/applicationprofile.Artifact'
    type: object
  applicationprofile.ApplicationProfile:
    properties:
      analysis:
        $ref: '#/definitions/applicationprofile.AnalysisSummary'
      app_id:
        type: string
      app_version:
        type: string
      artifact:
        $ref: '#/definitions/applicationprofile.Artifact'
      profile_id:
        type: string
      requirements:
        $ref: '#/definitions/applicationprofile.ApplicationRequirements'
      workload:
        $ref: '#/definitions/applicationprofile.WorkloadProfile'
    required:
    - analysis
    - app_id
    - app_version
    - profile_id
    - requirements
    - workload
    type: object
  applicationprofile.ApplicationRequirements:
    properties:
      accelerator:
        $ref: '#/definitions/applicationprofile.AcceleratorRequirements'
      compute:
        $ref: '#/definitions/applicationprofile.ComputeRequirements'
      cost:
        $ref: '#/definitions/applicationprofile.CostRequirements'
      deployment:
        $ref: '#/definitions/applicationprofile.DeploymentRequirements'
      slo:
        $ref: '#/definitions/applicationprofile.SLORequirements'
    required:
    - accelerator
    - compute
    - cost
    - deployment
    - slo
    type: object
  applicationprofile.Artifact:
    properties:
      entrypoint:
        items:
          type: string
        type: array
      type:
        type: string
      uri:
        type: string
    required:
    - type
    - uri
    type: object
  applicationprofile.ComputeRequirements:
    properties:
      cpu_cores_min:
        type: integer
      memory_mib_min:
        type: integer
      storage_gib_min:
        type: integer
    required:
    - cpu_cores_min
    - memory_mib_min
    - storage_gib_min
    type: object
  applicationprofile.CostRequirements:
    properties:
      cost_per_hour_max:
        type: number
      currency:
        type: string
    type: object
  applicationprofile.DeploymentRequirements:
    properties:
      isolation:
        type: string
      replicas_max:
        type: integer
      replicas_min:
        type: integer
    required:
    - isolation
    - replicas_max
    - replicas_min
    type: object
  applicationprofile.GenerateRequest:
    properties:
      app_spec:
        $ref: '#/definitions/applicationprofile.StructuredAppSpec'
      application:
        $ref: '#/definitions/applicationprofile.ApplicationMetadata'
      candidate_id:
        type: string
      input_type:
        enum:
        - natural_language
        - structured
        type: string
      request:
        maxLength: 8000
        type: string
      selection_policy:
        example: quality_first
        type: string
    type: object
  applicationprofile.GenerateResult:
    properties:
      analysis:
        $ref: '#/definitions/applicationprofile.AnalysisEvidence'
      application_profile:
        $ref: '#/definitions/applicationprofile.ApplicationProfile'
    required:
    - analysis
    - application_profile
    type: object
  applicationprofile.SLORequirements:
    properties:
      latency_p95_ms_max:
        type: number
      throughput_rps_min:
        type: number
    type: object
  applicationprofile.StructuredAppSpec:
    properties:
      accelerator_count:
        type: integer
      accelerator_memory_mib_per_device:
        type: integer
      accelerator_type:
        type: string
      app_id:
        type: string
      app_version:
        type: string
      artifact:
        $ref: '#/definitions/applicationprofile.Artifact'
      cost_currency:
        type: string
      cost_per_hour_max:
        type: number
      cpu_cores:
        type: integer
      expected_rps:
        type: number
      isolation:
        type: string
      latency_p95_ms_max:
        type: number
      memory_mib:
        type: integer
      replicas_max:
        type: integer
      replicas_min:
        type: integer
      request_pattern:
        enum:
        - ONLINE
        - BATCH
        - STREAMING
        type: string
      storage_gib:
        type: integer
      throughput_rps_min:
        type: number
      workload_type:
        type: string
    required:
    - app_id
    - app_version
    - cpu_cores
    - memory_mib
    - storage_gib
    - workload_type
    type: object
  applicationprofile.WorkloadProfile:
    properties:
      expected_rps:
        type: number
      request_pattern:
        type: string
      task_type:
        type: string
    required:
    - request_pattern
    - task_type
    type: object
  llmselection.RankedItem:
    properties:
      actual_model:
        type: string
      benchmark_status:
        type: string
      candidate_id:
        type: string
      evaluation_source:
        type: string
      evaluation_type:
        type: string
      metrics:
        additionalProperties:
          format: float64
          type: number
        type: object
      model:
        type: string
      notes:
        items:
          type: string
        type: array
      provider:
        type: string
      role:
        type: string
      score:
        type: number
    type: object
  llmselection.SelectRequest:
    properties:
      policy:
        example: quality_first
        type: string
    type: object
  llmselection.SelectionResponse:
    properties:
      benchmark_status:
        type: string
      evaluation_source:
        type: string
      evaluation_type:
        type: string
      policy:
        type: string
      ranking:
        items:
          $ref: '#/definitions/llmselection.RankedItem'
        type: array
      rationale:
        type: string
      selected_actual_model:
        type: string
      selected_candidate_id:
        type: string
      selected_model:
        type: string
      selected_provider:
        type: string
      selected_score:
        type: number
      valid:
        type: boolean
    required:
    - benchmark_status
    - evaluation_source
    - evaluation_type
    - policy
    - ranking
    - rationale
    - selected_actual_model
    - selected_model
    - selected_provider
    - valid
    type: object
  profileapi.ErrorResponse:
    properties:
      code:
        type: string
      message:
        type: string
    required:
    - code
    - message
    type: object
info:
  contact: {}
  description: Analyze natural-language or structured application requirements, select
    a configured LLM when needed, and generate a bounded ApplicationProfile. The service
    also exposes Ops LLM policy ranking; deployment planning and execution remain
    outside this service.
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  title: LLM_Op ApplicationProfile and Model Selection API
  version: "1.0"
paths:
  /api/v1/application-profiles:
    post:
      consumes:
      - application/json
      description: Validate natural-language or structured App Spec input and return
        a bounded ApplicationProfile. Natural-language analysis selects an LLM by
        policy, retries invalid output, and labels bounded local-rule fallback; structured
        input is converted without an LLM. This endpoint does not recommend infrastructure,
        select an Agent, create a manifest, submit a deployment, or process runtime
        feedback.
      operationId: GenerateApplicationProfile
      parameters:
      - description: Natural-language application requirements
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/applicationprofile.GenerateRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/applicationprofile.GenerateResult'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/profileapi.ErrorResponse'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/profileapi.ErrorResponse'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/profileapi.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/profileapi.ErrorResponse'
      summary: Generate an ApplicationProfile
      tags:
      - Application Profiles
  /api/v1/ops-llm/select:
    post:
      consumes:
      - application/json
      description: Rank configured Ops LLM candidates with a weighted policy. benchmark_status
        states whether the source metrics came from an executed benchmark; a not_executed
        result is a policy baseline, not a measured model-quality claim. This endpoint
        does not invoke the selected model or perform deployment work.
      operationId: SelectOpsLLM
      parameters:
      - description: Ops LLM selection policy
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/llmselection.SelectRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/llmselection.SelectionResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/profileapi.ErrorResponse'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/profileapi.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/profileapi.ErrorResponse'
      summary: Rank and select an Ops LLM candidate
      tags:
      - Ops LLM Selection
  /healthz:
    get:
      description: Return process readiness and the bounded LLM_Op role.
      operationId: GetLLMOpHealthz
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Check LLM_Op API health
      tags:
      - LLM_Op
  /openapi.yaml:
    get:
      operationId: GetLLMOpOpenAPI
      produces:
      - text/yaml
      responses:
        "200":
          description: OK
          schema:
            type: file
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/profileapi.ErrorResponse'
      summary: Get the LLM_Op OpenAPI specification
      tags:
      - LLM_Op
swagger: "2.0"
