name: role-separated validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r poc/optimization_research/requirements.txt -e 'poc/research_policy[test]'
      - run: python -m compileall -q poc/optimization_research/scripts poc/optimization_research/policies poc/research_policy/src
      - name: Policy, collection and ETL unit tests
        run: python -m pytest -q poc/research_policy/tests
      - name: Data-free optimization contracts
        run: >-
          python -m pytest -q
          poc/optimization_research/tests/test_data_contract.py
          poc/optimization_research/tests/test_philly_slot_day_core.py
          poc/optimization_research/tests/test_assess_gpu_shape_microbatch_v2.py
          poc/optimization_research/tests/test_assess_gpu_shape_microbatch_v3.py
          poc/optimization_research/tests/test_assess_gpu_shape_microbatch_v4.py
          poc/optimization_research/tests/test_assess_gpu_shape_microbatch_v5.py
          poc/optimization_research/tests/test_assess_gpu_shape_microbatch_v6.py
          poc/optimization_research/tests/test_assess_gpu_shape_microbatch_v7.py
  go:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [llmop/go/service-control-api, resource_ops, deployment_agent/go/service-control-api, deployment_agent/go/aiops-guard]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache: false
      - run: go test ./...
        working-directory: '${{ matrix.module }}'
      - run: go vet ./...
        working-directory: '${{ matrix.module }}'
  platform:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node --test platform/tests/*.test.mjs
        shell: bash
      - run: python -m pip install -r platform/requirements-test.txt
      - run: python -m unittest discover -s platform/tests -p 'test_*.py'
      - run: python -m unittest discover -s platform/runtime-vm -p 'test_*.py'
