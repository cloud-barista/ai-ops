name: Go CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.25"
          cache-dependency-path: |
            go/aiops-guard/go.mod
            go/service-control-api/go.sum

      - name: Test Go guard
        run: |
          cd go/aiops-guard
          go test ./...

      - name: Test Go service-control API
        run: |
          cd go/service-control-api
          go test ./...

      - name: Vet Go guard
        run: |
          cd go/aiops-guard
          go vet ./...

      - name: Vet Go service-control API
        run: |
          cd go/service-control-api
          go vet ./...

      - name: Check Go CLI
        run: |
          cd go/service-control-api
          go run ./cmd/aiops-service-control select-ops-llm \
            --config ../../config/ops_llm_benchmark.json \
            --policy quality_first

      - name: Run Go team validation
        run: |
          cd go/service-control-api
          go run ./cmd/aiops-service-control team-validation
