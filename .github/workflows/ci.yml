name: role-separated validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [llmop/go/service-control-api, resource_ops, deployment_agent/go/service-control-api, deployment_agent/go/aiops-guard]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache: false
      - run: go test ./...
        working-directory: '${{ matrix.module }}'
      - run: go vet ./...
        working-directory: '${{ matrix.module }}'
  platform:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node --test platform/tests/*.test.mjs
        shell: bash
      - run: python -m pip install -r platform/requirements-test.txt
      - run: python -m unittest discover -s platform/tests -p 'test_*.py'
      - run: python -m unittest discover -s platform/runtime-vm -p 'test_*.py'
