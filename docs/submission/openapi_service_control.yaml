openapi: 3.0.3
info:
  title: AI Service Control API
  version: "0.1.0"
  description: >
    Go Echo API contract for the 1st-year service-control prototype. The API
    exposes LLM selection, agent registry listing, CPU/GPU VM placement,
    AI application deployment/control plan generation, and service-operations readiness.
    It is a functional prototype contract, not a production AIOps API.
servers:
  - url: http://127.0.0.1:8080
paths:
  /healthz:
    get:
      summary: Health check
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /openapi.yaml:
    get:
      summary: Download this OpenAPI document
      responses:
        "200":
          description: OpenAPI YAML
          content:
            application/yaml:
              schema:
                type: string
  /api/v1/agents:
    get:
      summary: List registered AIOps agents
      responses:
        "200":
          description: Registered agent profiles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentListResponse"
    post:
      summary: Register an external AIOps agent
      description: Registers an external agent endpoint, capabilities, and bounded actions in process memory.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExternalAgentRegistrationRequest"
      responses:
        "201":
          description: Runtime agent registration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentProfile"
        "400":
          description: Invalid or duplicate registration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/agents/{name}:
    get:
      summary: Get a registered AIOps agent
      parameters:
        - $ref: "#/components/parameters/AgentName"
      responses:
        "200":
          description: Registered agent profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentProfile"
        "404":
          description: Agent not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/agents/{name}/actions/{action}/validate:
    post:
      summary: Validate an action against an agent boundary
      parameters:
        - $ref: "#/components/parameters/AgentName"
        - name: action
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Action validation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentActionValidationResponse"
        "404":
          description: Agent not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/agents/{name}/invocations/plan:
    post:
      summary: Build a validated external-agent invocation plan
      description: Validates capability and bounded action, then returns a plan without executing an external HTTP request.
      parameters:
        - $ref: "#/components/parameters/AgentName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentInvocationPlanRequest"
      responses:
        "200":
          description: Non-executing invocation plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentInvocationPlan"
        "400":
          description: Capability or action boundary validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/ops-llm/select:
    post:
      summary: Select the prototype Ops LLM candidate for an operation policy
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpsLLMSelectRequest"
      responses:
        "200":
          description: LLM ranking and selected candidate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpsLLMSelectionResponse"
        "400":
          description: Invalid policy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/apps/placement:
    post:
      summary: Recommend CPU/GPU VM placement for an AI workload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkloadRequest"
      responses:
        "200":
          description: Placement recommendation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlacementResponse"
        "400":
          description: Unknown workload or invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/apps/deployment-plan:
    post:
      summary: Build a CPU/GPU VM deployment/control plan for an AI workload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkloadRequest"
      responses:
        "200":
          description: Deployment/control plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeploymentPlanResponse"
        "400":
          description: Unknown workload or invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/service-operations/run:
    post:
      summary: Run the Go service operations readiness pipeline
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceOperationsRequest"
      responses:
        "200":
          description: Service operations readiness report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceOperationsResponse"
        "400":
          description: Invalid policy, workload, or config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  parameters:
    AgentName:
      name: name
      in: path
      required: true
      schema:
        type: string
  schemas:
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: ok
        service:
          type: string
          example: service-control-api
    ErrorResponse:
      type: object
      required:
        - valid
        - message
      properties:
        valid:
          type: boolean
          example: false
        message:
          type: string
          example: "Malformed request body: check JSON syntax"
    AgentListResponse:
      type: object
      properties:
        command:
          type: string
          example: list-agents
        version:
          type: string
          example: "1"
        persistence:
          type: string
          example: configuration_and_process_memory
        runtime_agent_count:
          type: integer
        agents:
          type: array
          items:
            $ref: "#/components/schemas/AgentProfile"
    AgentProfile:
      type: object
      properties:
        name:
          type: string
          example: AIApplicationManagementAgent
        korean_name:
          type: string
          example: AI application management agent
        version:
          type: string
        role:
          type: string
        responsibilities:
          type: array
          items:
            type: string
        capabilities:
          type: array
          items:
            type: string
        bounded_actions:
          type: array
          items:
            type: string
        reward_signals:
          type: array
          items:
            type: string
        enabled:
          type: boolean
        endpoint:
          type: string
          format: uri
        invocation_path:
          type: string
        source:
          type: string
          enum: [configuration, runtime]
        registered_at:
          type: string
          format: date-time
    ExternalAgentRegistrationRequest:
      type: object
      required: [name, version, role, endpoint, invocation_path, capabilities, bounded_actions]
      properties:
        name:
          type: string
          pattern: "^[A-Za-z][A-Za-z0-9_-]{2,63}$"
        korean_name:
          type: string
        version:
          type: string
        role:
          type: string
        responsibilities:
          type: array
          items:
            type: string
        endpoint:
          type: string
          format: uri
        invocation_path:
          type: string
          example: /v1/actions
        capabilities:
          type: array
          minItems: 1
          items:
            type: string
        bounded_actions:
          type: array
          minItems: 1
          items:
            type: string
        reward_signals:
          type: array
          items:
            type: string
        enabled:
          type: boolean
          default: true
    AgentActionValidationResponse:
      type: object
      properties:
        agent:
          type: string
        action:
          type: string
        valid:
          type: boolean
    AgentInvocationPlanRequest:
      type: object
      required: [capability, action]
      properties:
        capability:
          type: string
        action:
          type: string
        parameters:
          type: object
          additionalProperties: true
    AgentInvocationPlan:
      type: object
      properties:
        valid:
          type: boolean
        agent:
          type: string
        capability:
          type: string
        action:
          type: string
        target_url:
          type: string
          format: uri
        parameters:
          type: object
          additionalProperties: true
        execution_status:
          type: string
          enum: [not_executed]
        reason:
          type: string
    OpsLLMSelectRequest:
      type: object
      properties:
        policy:
          type: string
          example: quality_first
    OpsLLMSelectionResponse:
      type: object
      properties:
        valid:
          type: boolean
        policy:
          type: string
        selected_model:
          type: string
          example: primary-ops-llm
        selected_actual_model:
          type: string
          example: to-be-evaluated-primary-model
        selected_provider:
          type: string
          example: prototype-policy
        evaluation_source:
          type: string
          example: prototype_policy_config
        evaluation_type:
          type: string
          example: prototype_policy_baseline
        benchmark_status:
          type: string
          example: not_executed
        selected_score:
          type: number
        rationale:
          type: string
        ranking:
          type: array
          items:
            type: object
    WorkloadRequest:
      type: object
      required:
        - workload
      properties:
        workload:
          type: string
          example: llm-chat-inference
    ServiceOperationsRequest:
      type: object
      required:
        - workload
      properties:
        llm_config:
          type: string
          example: config/ops_llm_benchmark.json
        inference_config:
          type: string
          example: config/inference_optimization.json
        llm_policy:
          type: string
          example: quality_first
        workload:
          type: string
          description: AI workload ID used for placement and deployment-plan generation.
          example: llm-chat-inference
        operation_service:
          type: string
          description: AI service used for bounded operation validation.
          example: llm-chat-inference
        operation_resource:
          type: string
          description: CPU/GPU VM resource used for bounded operation validation.
          example: gpu-vm-l4
        mode:
          type: string
          example: mock
        guard_backend:
          type: string
          example: go
    PlacementResponse:
      type: object
      properties:
        valid:
          type: boolean
        workload:
          type: string
        selected_resource:
          type: string
          example: gpu-vm-l4
        action:
          type: string
          example: deploy_on_gpu_vm
        score:
          type: number
        slo_satisfied:
          type: boolean
        rejected_resources:
          type: object
        ranked_candidates:
          type: array
          items:
            type: object
    DeploymentPlanResponse:
      allOf:
        - $ref: "#/components/schemas/PlacementResponse"
        - type: object
          properties:
            deployment_plan:
              $ref: "#/components/schemas/DeploymentPlan"
    DeploymentPlan:
      type: object
      properties:
        service_name:
          type: string
        container_image:
          type: string
        target_resource:
          type: string
        target_accelerator:
          type: string
        vm_deployment:
          type: object
          properties:
            service:
              type: string
              description: AI application service name.
            instances:
              type: integer
            placement_constraints:
              type: object
            resources:
              type: object
        control_actions:
          type: array
          items:
            type: string
        monitoring_metrics:
          type: array
          items:
            type: string
    GuardValidation:
      type: object
      properties:
        backend:
          type: string
          example: go
        valid:
          type: boolean
        runtime_wired:
          type: boolean
          example: false
        mode:
          type: string
          example: mock
        boundary:
          type: string
        operation_service:
          type: string
        operation_resource:
          type: string
        checked_actions:
          type: array
          items:
            type: string
        reason:
          type: string
    ServiceOperationsResponse:
      type: object
      properties:
        command:
          type: string
          example: run-service-operations
        valid:
          type: boolean
        selected_llm:
          type: string
          example: primary-ops-llm
        selected_actual_model:
          type: string
          example: to-be-evaluated-primary-model
        selected_provider:
          type: string
          example: prototype-policy
        evaluation_source:
          type: string
          example: prototype_policy_config
        evaluation_type:
          type: string
          example: prototype_policy_baseline
        benchmark_status:
          type: string
          example: not_executed
        runtime_model:
          type: string
          example: primary-ops-llm
        selected_resource:
          type: string
          example: gpu-vm-l4
        deployment_plan:
          $ref: "#/components/schemas/DeploymentPlan"
        inference_deployment_plan:
          $ref: "#/components/schemas/DeploymentPlanResponse"
        deployment_validation:
          type: object
        deployment_execution_mode:
          type: string
          enum:
            - mock
          example: mock
        agent_reviews:
          type: object
        operation:
          type: object
        operation_pipeline_ready:
          type: boolean
        guard_backend:
          type: string
          example: go
        guard_validation:
          $ref: "#/components/schemas/GuardValidation"
        metadata:
          type: object
