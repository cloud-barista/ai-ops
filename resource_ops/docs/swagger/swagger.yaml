      health:
        type: number
      memory:
        type: number
      storage:
        type: number
      total:
        type: number
    type: object
  resource.StorageProfile:
    properties:
      available_gib:
        type: number
      total_gib:
        type: number
    type: object
  resource.WorkloadProfile:
    properties:
      expected_rps:
        type: number
      request_pattern:
        type: string
      task_type:
        type: string
    type: object
info:
  contact: {}
  description: Discover, normalize, filter, and rank infrastructure resources from
    an ApplicationProfile and resource observations.
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  title: AI-MCMP Resource Ops API
  version: 0.2.0
paths:
  /api/v1/resource-recommendations:
    post:
      consumes:
      - application/json
      description: Project application requirements into resource constraints, collect
        and normalize observations, filter unavailable or insufficient resources,
        and rank the remaining candidates. This endpoint returns recommendations without
        deploying applications.
      operationId: RecommendResourcesFromProfile
      parameters:
      - description: ApplicationProfile, selectors, and ranking preferences
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/resource.ProfileRecommendationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/resource.ResourceRecommendation'
        "400":
          description: Malformed JSON, unknown fields, or request body over 1 MiB
          schema:
            $ref: '#/definitions/api.errorResponse'
        "422":
          description: Invalid ApplicationProfile or resource query
          schema:
            $ref: '#/definitions/api.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.errorResponse'
        "502":
          description: Resource source unavailable
          schema:
            $ref: '#/definitions/api.errorResponse'
      summary: Recommend infrastructure resources for an ApplicationProfile
      tags:
      - Resource Recommendations
  /health:
    get:
      operationId: GetResourceOpsHealth
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Check Resource Ops health and capabilities
      tags:
      - Service
  /legacy/api/v1/resource-recommendations:
    post:
      consumes:
      - application/json
      deprecated: true
      description: Compatibility endpoint for clients that supply resource constraints
        directly.
      operationId: RecommendResourcesFromLegacyQuery
      parameters:
      - description: Legacy resource query
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/resource.ResourceQuery'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/resource.ResourceRecommendation'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.errorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/api.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.errorResponse'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/api.errorResponse'
      summary: Recommend resources from a legacy ResourceQuery
      tags:
      - Legacy
  /openapi.yaml:
    get:
      operationId: GetResourceOpsOpenAPI
      produces:
      - text/yaml
      responses:
        "200":
          description: OK
          schema:
            type: file
      summary: Download the Resource Ops API specification
      tags:
      - Service
swagger: "2.0"
