[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "khu-policy-agent"
version = "0.1.0"
description = "KHU offline reward prediction and guarded configuration selection"
requires-python = ">=3.10"
dependencies = ["scikit-learn>=1.3,<2", "joblib>=1.3,<2"]
license = "Apache-2.0"

[project.scripts]
khu-policy-agent = "khu_policy_agent.cli:main"

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
where = ["src"]
