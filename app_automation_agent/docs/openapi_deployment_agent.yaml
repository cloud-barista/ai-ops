              application_profile:
                $ref: '#/components/schemas/ApplicationProfile'
              model_recommendation:
                $ref: '#/components/schemas/ApplicationModelRecommendation'
    ApplicationModelRecommendation:
      type: object
      required:
      - selected_model
      - inference_configuration
      properties:
        recommendation_id:
          type: string
        selected_model:
          type: object
          required:
          - model_id
          - model_version
          - source
          properties:
            model_id:
              type: string
            model_version:
              type: string
            source:
              type: string
        inference_configuration:
          type: object
          required:
          - runtime_engine
          - precision
          - max_batch_size
          - max_concurrency
          - tensor_parallel_size
          - replicas
          properties:
            runtime_engine:
              type: string
            precision:
              type: string
            max_batch_size:
              type: integer
              minimum: 1
            max_concurrency:
              type: integer
              minimum: 1
            tensor_parallel_size:
              type: integer
              minimum: 1
            replicas:
              type: integer
              minimum: 1
    ScalingDecision:
      type: object
      required:
      - action
      - reason
      - current_replicas
      - desired_replicas
      - created_at
      properties:
        decision_id:
          type: string
          description: 'Local decision identity assigned after Guard approval. This is not an execution action
            ID and is absent from rejected proposals.

            '
        action:
          type: string
          description: 'Canonical scaling recommendation. KEEP preserves the latest guarded plan''s desired
            replica count. Legacy NO_ACTION is accepted only as an Operation Agent proposal/result value and
            is normalized to KEEP before Guard validation; new responses use KEEP.

            '
          enum:
          - KEEP
          - SCALE_OUT
          - SCALE_IN
        reason:
          type: string
          minLength: 1
          maxLength: 8000
        current_replicas:
          type: integer
          minimum: 1
          description: Latest guarded plan's desired count; an applied replica count is not independently
            observed here.
        desired_replicas:
          type: integer
          minimum: 1
        evidence:
          type: array
          items:
            type: string
        created_at:
          type: string
          format: date-time
    OperationOptimizationResult:
      type: object
      required:
      - run_id
      - status
      description: 'Evidence returned by the Operation Optimization Agent after deployment status and optimization
        Feedback are joined. run_id is a deterministic, auditable operation execution identifier derived from
        the Flow and Feedback event. A completed result carries source, request_guard, result_guard, scaling_guard,
        and decision; all Guards remain outside the Agent. Terminal failed or rejected evidence may omit unavailable
        identity, Guard, latency, and decision fields and contains only terminal-safe evidence. Only a completed
        result with approved Guards can populate scaling_decision.

        '
      properties:
        run_id:
          type: string
        agent_name:
          type: string
          description: Present when the selected Agent identity is known.
          example: OperationOptimizationAgent
        source:
          type: string
          enum:
          - configuration
          - runtime
          description: Present for a resolved Agent.
        status:
          type: string
          enum:
          - completed
          - rejected
          - failed
        latency_ms:
          type: integer
          format: int64
          description: Present when execution latency is available.
        request_guard:
          $ref: '#/components/schemas/AgentControlGuardResult'
        result_guard:
          $ref: '#/components/schemas/AgentControlGuardResult'
        scaling_guard:
          $ref: '#/components/schemas/AgentControlGuardResult'
        decision:
          $ref: '#/components/schemas/ScalingDecision'
        message:
          type: string
          description: Terminal-safe execution summary.
    AgentControlGuardResult:
      type: object
      required:
      - status
      - checks
      properties:
        status:
          type: string
          enum:
          - APPROVED
          - REJECTED
          - RETRY_REQUIRED
        checks:
          type: array
          items:
            type: object
            required:
            - name
            - passed
            - reason
            properties:
              name:
                type: string
              passed:
                type: boolean
              reason:
                type: string
        issues:
          type: array
          items:
            $ref: '#/components/schemas/ValidationIssue'
    ValidationIssue:
      type: object
      required:
      - field
      - code
      - reason
      properties:
        field:
          type: string
        code:
          type: string
        reason:
          type: string
        expected: {}
        actual: {}
    FeedbackSummary:
      type: object
      required:
      - deployment_id
      - decision_id
      - deployment_state
      - success
      - cause
      - updated_at
      properties:
        deployment_id:
          type: string
        decision_id:
          type: string
        deployment_state:
          type: string
        outcome:
          type: string
        success:
          type: boolean
        cause:
          type: string
        slo_violations:
          type: array
          items:
            type: string
        metrics:
          $ref: '#/components/schemas/OptimizationMetrics'
        updated_at:
          type: string
          format: date-time
    AgentControlManifestRevision:
      type: object
      required:
      - revision
      - phase
      - trigger_action
      - created_at
      - desired_deployment_spec
      - deployment_request
      properties:
        revision:
          type: integer
          minimum: 1
        phase:
          type: string
          enum:
          - INITIAL
          - OPTIMIZED
        trigger_action:
          type: string
        trigger_decision_id:
          type: string
          description: Local scaling decision ID for an optimized revision; absent from the initial revision.
            It is not an execution action ID.
        created_at:
          type: string
          format: date-time
        desired_deployment_spec:
          $ref: '#/components/schemas/DesiredDeploymentSpec'
        deployment_request:
          $ref: '#/components/schemas/DeploymentCreateRequestEnvelope'
    DeploymentCreateRequestEnvelope:
      allOf:
      - $ref: '#/components/schemas/CommonMessageEnvelope'
      - type: object
        required:
        - data
        properties:
          message_type:
            type: string
            enum:
            - deployment.create.request
          data:
            type: object
            required:
            - deployment_request
            properties:
              deployment_request:
                $ref: '#/components/schemas/AgentControlDeploymentRequest'
    AgentControlDeploymentRequest:
      type: object
      required:
      - request_id
      - decision_id
      - application
      - deployment_manifest
      properties:
        request_id:
          type: string
          description: Idempotency key for deployment execution.
        decision_id:
          type: string
        application:
          $ref: '#/components/schemas/AgentControlDeploymentApplication'
        deployment_manifest:
          $ref: '#/components/schemas/AgentControlDeploymentManifest'
    AgentControlDeploymentManifest:
      type: object
      required:
      - manifest_id
      - manifest_version
      - decision_id
      - application
      - target_runtime
      - desired_infrastructure
      - inference_configuration
      - metadata
      properties:
        manifest_id:
          type: string
        manifest_version:
          type: string
          enum:
          - '1.0'
        decision_id:
          type: string
        application:
          type: object
          required:
          - app_id
          - app_version
          properties:
            app_id:
              type: string
            app_version:
              type: string
        target_runtime:
          type: string
          enum:
          - VM
        desired_infrastructure:
          $ref: '#/components/schemas/DesiredInfrastructure'
        inference_configuration:
          type: object
          additionalProperties: true
        runtime:
          type: object
          properties:
            command:
              type: array
              items:
                type: string
            args:
              type: array
              items:
                type: string
            environment:
              type: object
              additionalProperties:
                type: string
            ports:
              type: array
              items:
                type: object
                required:
                - name
                - port
                - protocol
                properties:
                  name:
                    type: string
                  port:
                    type: integer
                    minimum: 1
                    maximum: 65535
                  protocol:
                    type: string
            restart_policy:
              type: string
        resource_hints:
          type: array
          items:
            type: string
        metadata:
          type: object
          required:
          - profile_id
          properties:
            profile_id:
              type: string
    AgentControlDeploymentApplication:
      type: object
      required:
      - app_id
      - app_version
      properties:
        app_id:
          type: string
        app_version:
          type: string
        artifact:
          type: object
          required:
          - type
          - uri
          properties:
            type:
              type: string
            uri:
              type: string
            entrypoint:
              type: array
              items:
                type: string
    DesiredDeploymentSpec:
      type: object
      required:
      - spec_version
      - decision_id
      - application
      - target_runtime
      - desired_infrastructure
      - inference_configuration
      - metadata
      properties:
        spec_version:
          type: string
          enum:
          - '1.0'
        decision_id:
          type: string
        application:
          type: object
          required:
          - app_id
          - app_version
          properties:
            app_id:
              type: string
            app_version:
              type: string
        target_runtime:
          type: string
          enum:
          - VM
        desired_infrastructure:
          $ref: '#/components/schemas/DesiredInfrastructure'
        inference_configuration:
          type: object
          additionalProperties: true
        runtime:
          type: object
          additionalProperties: true
        policy_hints:
          type: array
          items:
            type: string
        metadata:
          type: object
          required:
          - profile_id
          properties:
            profile_id:
              type: string
    AgentControlDeploymentPlan:
      type: object
      required:
      - plan_id
      - profile_id
      - app_id
      - app_version
      - selected_candidate_id
      - target_runtime
      - desired_infrastructure
      - inference_configuration
      - reasoning_mode
      - created_at
      properties:
        plan_id:
          type: string
        profile_id:
          type: string
        app_id:
          type: string
        app_version:
          type: string
        selected_candidate_id:
          type: string
        target_runtime:
          type: string
          enum:
          - VM
        desired_infrastructure:
          $ref: '#/components/schemas/DesiredInfrastructure'
        inference_configuration:
          type: object
          additionalProperties: true
        resource_hints:
          type: array
          items:
            type: string
        reasoning_mode:
          type: string
          enum:
          - rule_based
        created_at:
          type: string
          format: date-time
    AutomationDecision:
      type: object
      required:
      - decision_id
      - action
      - reason
      - reasoning_mode
      - confidence
      - created_at
      properties:
        decision_id:
          type: string
        action:
          type: string
          enum:
          - DEPLOY
          - REJECT
          - RETRY
        reason:
          type: string
        reasoning_mode:
          type: string
          enum:
          - rule_based
        confidence:
          type: number
          minimum: 0
          maximum: 1
        selected_candidate_id:
          type: string
        correction_request:
          $ref: '#/components/schemas/CorrectionRequest'
        created_at:
          type: string
          format: date-time
    CorrectionRequest:
      type: object
      required:
      - target
      - reason
      - issues
      properties:
        target:
          type: string
          enum:
          - application_profile
          - resource_recommendation
        reason:
          type: string
        issues:
          type: array
          items:
            $ref: '#/components/schemas/ValidationIssue'
    DecisionAgentResult:
      type: object
      required:
      - agent_name
      - source
      - status
      - request_guard
      - result_guard
      - decision
      - latency_ms
      properties:
        agent_name:
          type: string
        source:
          type: string
          enum:
          - configuration
          - runtime
        status:
          type: string
          enum:
          - completed
          - rejected
          - failed
        request_guard:
          $ref: '#/components/schemas/AgentControlGuardResult'
        result_guard:
          $ref: '#/components/schemas/AgentControlGuardResult'
        decision:
          $ref: '#/components/schemas/AutomationDecision'
        latency_ms:
          type: integer
          format: int64
          minimum: 0
        message:
          type: string
    AgentAuthorization:
      type: object
      required:
      - agent_name
      - capability
      - action
      - authorized
      - reason
      properties:
        agent_name:
          type: string
          description: Selected configuration or Runtime Agent name
        capability:
          type: string
          enum:
          - ai_application_automation
        action:
          type: string
          enum:
          - generate_deployment_decision
        authorized:
          type: boolean
        reason:
          type: string
    AgentProfile:
      type: object
      properties:
        name:
          type: string
        korean_name:
          type: string
        version:
          type: string
        owner:
          type: string
        framework:
          type: string
        serves_framework:
          type: string
        namespace:
          type: string
        role:
          type: string
        responsibilities:
          type: array
          items:
            type: string
        capabilities:
          type: array
          items:
            type: string
        bounded_actions:
          type: array
          items:
            type: string
        enabled:
          type: boolean
        endpoint:
          type: string
          format: uri
        invocation_path:
          type: string
        auth_token_env:
          type: string
          description: Environment variable name containing an optional bearer token. The token value is never
            returned.
        source:
          type: string
          enum:
          - configuration
          - runtime
          - ai_app_engine
        registered_at:
          type: string
          format: date-time
    ErrorResponse:
      type: object
      required:
      - valid
      - message
      properties:
        valid:
          type: boolean
          example: false
        message:
          type: string
    ExternalAgentRegistrationRequest:
      type: object
      required:
      - name
      - version
      - role
      - endpoint
      - invocation_path
      - capabilities
      - bounded_actions
      properties:
        name:
          type: string
        korean_name:
          type: string
        version:
          type: string
        role:
          type: string
        responsibilities:
          type: array
          items:
            type: string
        endpoint:
          type: string
          format: uri
        invocation_path:
          type: string
          example: /v1/actions
        auth_token_env:
          type: string
          description: Optional environment variable name containing a bearer token.
        capabilities:
          type: array
          minItems: 1
          items:
            type: string
        bounded_actions:
          type: array
          minItems: 1
          items:
            type: string
        enabled:
          type: boolean
          default: true
    ReadinessResponse:
      type: object
      required:
      - status
      - service
      properties:
        status:
          type: string
          enum:
          - ready
          - not_ready
        service:
          type: string
          example: geon
    AgentControlReasoningComparisonRequest:
      type: object
      required:
      - candidate_id
      properties:
        candidate_id:
          type: string
          example: qwen3.5-ops-planner
