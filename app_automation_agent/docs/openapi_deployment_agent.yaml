        targets:
          type: array
          items:
            type: object
            required: [kind, nsId, infraId, nodeId]
            properties:
              kind:
                type: string
                enum: [node]
              nsId:
                type: string
              infraId:
                type: string
              nodeId:
                type: string
        inference:
          type: object
