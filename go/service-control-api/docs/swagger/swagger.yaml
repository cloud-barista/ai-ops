info:
  contact: {}
  description: Go Echo API for AI LLM operation management, agent registry management,
    CPU/GPU VM placement, and AI application deployment-control planning.
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  title: AI-Ops Service Control API
  version: "0.1"
paths:
  /api/v1/agent-control/application-contexts:
    post:
      consumes:
      - application/json
      description: Validate and store a Common JSON v1.0 application.context.created
        message.
      operationId: PostAgentControlApplicationContext
      parameters:
      - description: Application Context message
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/agentcontrol.ApplicationContextEnvelope'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/agentcontrol.Flow'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: Receive an Application Context message
      tags:
      - AI Application Automation Agent
  /api/v1/agent-control/deployment-status:
    post:
      consumes:
      - application/json
      description: Validate and attach a Common JSON v1.0 deployment.status.changed
        message to an Agent Control flow.
      operationId: PostAgentControlDeploymentStatus
      parameters:
      - description: Deployment status message
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/agentcontrol.DeploymentStatusEnvelope'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/agentcontrol.Flow'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: Receive a deployment status message
      tags:
      - AI Application Automation Agent
  /api/v1/agent-control/flows:
    delete:
      description: Clear the in-memory Agent Control experiment records.
      operationId: DeleteAgentControlFlows
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Delete all generated Agent Control flows
      tags:
      - AI Application Automation Agent
    get:
      description: Return Application Context and Resource Recommendation correlation
        flows.
      operationId: GetAgentControlFlows
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: List joined Agent Control inputs
      tags:
      - AI Application Automation Agent
  /api/v1/agent-control/flows/{correlation_id}:
    delete:
      description: Delete one in-memory Agent Control experiment record by correlation_id.
      operationId: DeleteAgentControlFlow
      parameters:
      - description: Common JSON correlation ID
        in: path
        name: correlation_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: Delete one generated Agent Control flow
      tags:
      - AI Application Automation Agent
    get:
