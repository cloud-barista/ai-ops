basePath: /
definitions:
  api.AgentInvocationPlan:
    properties:
      action:
        type: string
      agent:
        type: string
      capability:
        type: string
      execution_status:
        type: string
      parameters:
        additionalProperties: {}
        type: object
      reason:
        type: string
      target_url:
        type: string
      valid:
        type: boolean
    type: object
  api.AgentInvocationPlanRequest:
    properties:
      action:
        type: string
      capability:
        type: string
      parameters:
        additionalProperties: {}
        type: object
    required:
    - action
    - capability
    type: object
  api.AgentProfile:
    properties:
      bounded_actions:
        items:
          type: string
        type: array
      capabilities:
        items:
          type: string
        type: array
      enabled:
        type: boolean
      endpoint:
        type: string
      invocation_path:
        type: string
      korean_name:
        type: string
      name:
        type: string
      registered_at:
        type: string
      responsibilities:
        items:
          type: string
        type: array
      reward_signals:
        items:
          type: string
        type: array
      role:
        type: string
      source:
        type: string
      version:
        type: string
    type: object
  api.AgentReview:
    properties:
      action:
        type: string
      agent:
        type: string
      approved:
        type: boolean
      parameters:
        additionalProperties:
          type: string
        type: object
      reason:
        type: string
      reviewer_type:
        type: string
      reward:
        type: number
      skipped:
        type: boolean
    type: object
  api.AgentReviews:
    properties:
      application:
        $ref: '#/definitions/api.AgentReview'
      cost:
        $ref: '#/definitions/api.AgentReview'
      infrastructure:
        $ref: '#/definitions/api.AgentReview'
    type: object
  api.AppDeployPlannerRequest:
    properties:
      app_version_id:
        example: appver-llm-inference-v1
        type: string
      candidate_id:
        example: qwen3.5-ops-planner
        type: string
      max_poll_attempts:
        example: 60
        maximum: 600
        minimum: 1
        type: integer
      natural_language_request:
        example: GPU 1개와 메모리 16Gi가 필요한 추론 앱을 배포해 주세요.
        maxLength: 8000
        type: string
      parameters:
        additionalProperties: {}
        type: object
      poll_interval_ms:
        example: 1000
        maximum: 60000
        minimum: 1
        type: integer
      requested_by:
        example: ai-ops-geon-planner
        type: string
      target_profile_id:
        example: target-profile-hint
        type: string
    required:
    - app_version_id
    - candidate_id
    - natural_language_request
    type: object
  api.AutomationFeedbackRecord:
    properties:
      correlation_id:
        type: string
      executor:
        type: string
      external_execution_id:
        type: string
      latency_ms:
        type: number
      message:
        type: string
      received_at:
        type: string
      status:
        type: string
      throughput_rps:
        type: number
    required:
    - correlation_id
    - executor
    - status
    type: object
  api.AutomationFeedbackRequest:
    properties:
      correlation_id:
        type: string
      executor:
        type: string
      external_execution_id:
        type: string
      latency_ms:
        type: number
      message:
        type: string
      status:
        type: string
      throughput_rps:
        type: number
    required:
    - correlation_id
    - executor
    - status
    type: object
  api.DeploymentPlan:
    properties:
      allowed_actions:
        items:
          type: string
        type: array
      execution_status:
        type: string
      executor_type:
        type: string
      feedback_required:
        type: boolean
      preconditions:
        items:
          type: string
        type: array
      requested_action:
        type: string
      required_capability:
        type: string
      selected_executor:
        type: string
      service_name:
        type: string
      target_accelerator:
        type: string
      target_vm_id:
        type: string
      workload:
        type: string
    type: object
  api.DeploymentPlanResponse:
    properties:
      action:
        type: string
      checks:
        items:
          $ref: '#/definitions/api.VMCompatibilityCheck'
        type: array
      compatibility_status:
        type: string
      deployment_plan:
        $ref: '#/definitions/api.DeploymentPlan'
      evidence_status:
        type: string
      performance_status:
        type: string
      reason:
        type: string
      resource_checks_passed:
        type: boolean
      resource_source:
        type: string
      target_vm_id:
        type: string
      valid:
        type: boolean
      validation_mode:
        type: string
      workload:
        type: string
    type: object
  api.DeploymentValidation:
    properties:
      checks:
        items:
          type: string
        type: array
      mode:
        type: string
      reason:
        type: string
      valid:
        type: boolean
    type: object
  api.ErrorResponse:
    properties:
      message:
        example: 'Malformed request body: check JSON syntax'
        type: string
      valid:
        example: false
        type: boolean
    type: object
  api.ExternalAgentRegistrationRequest:
    properties:
      bounded_actions:
        items:
          type: string
        minItems: 1
        type: array
      capabilities:
        items:
          type: string
        minItems: 1
        type: array
      enabled:
        type: boolean
      endpoint:
        type: string
      invocation_path:
        type: string
      korean_name:
        type: string
      name:
        type: string
      responsibilities:
        items:
          type: string
        type: array
      reward_signals:
        items:
          type: string
        type: array
      role:
        type: string
      version:
        type: string
    required:
    - bounded_actions
    - capabilities
    - endpoint
    - invocation_path
    - name
    - role
    - version
    type: object
  api.GuardDecision:
    properties:
      reason:
        type: string
      status:
        type: string
      valid:
        type: boolean
    type: object
  api.GuardValidation:
    properties:
      backend:
        type: string
      boundary:
        type: string
      checked_actions:
        items:
          type: string
        type: array
      mode:
        type: string
      operation_resource:
        type: string
      operation_service:
        type: string
      reason:
        type: string
      runtime_wired:
        type: boolean
      valid:
        type: boolean
    type: object
  api.LLMActionProposal:
    properties:
      action:
        type: string
      confidence:
        type: number
      parameters:
        additionalProperties: {}
        type: object
      reason:
        type: string
      required_capability:
        type: string
      target_vm_id:
        type: string
    type: object
  api.LLMAutomationActionRequest:
    properties:
      candidate_id:
        example: qwen3.5-ops-planner
        type: string
      observations:
        additionalProperties: {}
        type: object
      target_vm:
        $ref: '#/definitions/api.VMResourceSnapshot'
      workload:
        example: llm-chat-inference
        type: string
    required:
    - candidate_id
    - target_vm
    - workload
    type: object
  api.LLMAutomationActionResponse:
    properties:
      correlation_id:
        type: string
      decision:
        $ref: '#/definitions/api.LLMDecisionResult'
      guard:
        $ref: '#/definitions/api.GuardDecision'
      handoff:
        $ref: '#/definitions/api.AgentInvocationPlan'
      status:
        type: string
      valid:
        type: boolean
      vm_compatibility:
        $ref: '#/definitions/api.VMCompatibilityResponse'
    type: object
  api.LLMDecisionResult:
    properties:
      actual_model:
        type: string
      candidate_id:
        type: string
      decision_execution_status:
        type: string
      latency_ms:
        type: integer
      proposal:
        $ref: '#/definitions/api.LLMActionProposal'
      provider:
        type: string
    type: object
  api.OperationReadiness:
    properties:
      reason:
        type: string
      service:
        type: string
      skipped:
        type: boolean
      target_resource:
        type: string
      valid:
        type: boolean
    type: object
  api.OpsLLMRankedItem:
    properties:
      actual_model:
        type: string
      benchmark_status:
        type: string
      evaluation_source:
        type: string
      evaluation_type:
        type: string
      metrics:
        additionalProperties:
          format: float64
          type: number
        type: object
      model:
        type: string
      notes:
        items:
          type: string
        type: array
      provider:
        type: string
      role:
        type: string
      score:
        type: number
    type: object
  api.OpsLLMSelectRequest:
    properties:
      policy:
        example: quality_first
        type: string
    type: object
  api.OpsLLMSelectionResponse:
    properties:
      benchmark_status:
        type: string
      evaluation_source:
        type: string
      evaluation_type:
        type: string
      policy:
        type: string
      ranking:
        items:
          $ref: '#/definitions/api.OpsLLMRankedItem'
        type: array
      rationale:
        type: string
      selected_actual_model:
        type: string
      selected_model:
        type: string
      selected_provider:
        type: string
      selected_score:
        type: number
      valid:
        type: boolean
    type: object
  api.ServiceOperationsRequest:
    properties:
      guard_backend:
        example: go
        type: string
      llm_candidate_id:
        example: qwen3.5-ops-planner
        type: string
      llm_candidates:
        example: config/ops_llm_eval_candidates.local_ollama.json
        type: string
      llm_config:
        example: config/ops_llm_benchmark.json
        type: string
      llm_policy:
        example: quality_first
        type: string
      mode:
        example: plan_only
        type: string
      observations:
        additionalProperties: {}
        type: object
      operation_resource:
        type: string
      operation_service:
        example: llm-chat-inference
        type: string
      target_vm:
        $ref: '#/definitions/api.VMResourceSnapshot'
      vm_requirements:
        example: config/vm_workload_requirements.json
        type: string
      workload:
        example: llm-chat-inference
        type: string
    required:
    - target_vm
    - workload
    type: object
  api.ServiceOperationsResponse:
    properties:
      agent_reviews:
        $ref: '#/definitions/api.AgentReviews'
      benchmark_status:
        type: string
      command:
        type: string
      decision_execution_status:
        type: string
      deployment_execution_mode:
        type: string
      deployment_plan:
        $ref: '#/definitions/api.DeploymentPlan'
      deployment_validation:
        $ref: '#/definitions/api.DeploymentValidation'
      evaluation_source:
        type: string
      evaluation_type:
        type: string
      guard_backend:
        type: string
      guard_validation:
        $ref: '#/definitions/api.GuardValidation'
      inference_deployment_plan:
        $ref: '#/definitions/api.DeploymentPlanResponse'
      llm_automation_action:
        $ref: '#/definitions/api.LLMAutomationActionResponse'
      metadata:
        additionalProperties:
          type: string
        type: object
      operation:
        $ref: '#/definitions/api.OperationReadiness'
      operation_pipeline_ready:
        type: boolean
      runtime_model:
        type: string
      selected_actual_model:
        type: string
      selected_llm:
        type: string
      selected_provider:
        type: string
      selected_resource:
        type: string
      valid:
        type: boolean
    type: object
  api.VMCompatibilityCheck:
    properties:
      actual:
        type: string
      name:
        type: string
      reason:
        type: string
      required:
        type: string
      status:
        type: string
    type: object
  api.VMCompatibilityRequest:
    properties:
      target_vm:
        $ref: '#/definitions/api.VMResourceSnapshot'
      workload:
        example: llm-chat-inference
        type: string
    required:
    - target_vm
    - workload
    type: object
  api.VMCompatibilityResponse:
    properties:
      action:
        type: string
      checks:
        items:
          $ref: '#/definitions/api.VMCompatibilityCheck'
        type: array
      compatibility_status:
        type: string
      evidence_status:
        type: string
      performance_status:
        type: string
      reason:
        type: string
      resource_checks_passed:
        type: boolean
      resource_source:
        type: string
      target_vm_id:
        type: string
      valid:
        type: boolean
      validation_mode:
        type: string
      workload:
        type: string
    type: object
  api.VMPerformanceEvidence:
    properties:
      cost_per_hour:
        type: number
      latency_ms:
        type: number
      measured_at:
        type: string
      source:
        type: string
      status:
        type: string
      throughput_rps:
        type: number
    type: object
  api.VMResourceSnapshot:
    properties:
      accelerator:
        type: string
      availability_zone:
        type: string
      collected_at:
        type: string
      cpu_cores:
        type: integer
      cuda_version:
        type: string
      driver_version:
        type: string
      evidence_status:
        type: string
      gpu_memory_mib:
        type: integer
      gpu_model:
        type: string
      id:
        type: string
      instance_type:
        type: string
      memory_gb:
        type: number
      performance:
        $ref: '#/definitions/api.VMPerformanceEvidence'
      provider:
        type: string
      region:
        type: string
      source:
        type: string
    required:
    - accelerator
    - evidence_status
    - id
    - source
    type: object
info:
  contact: {}
  description: Go Echo API for AI LLM operation management, agent registry management,
    CPU/GPU VM placement, and AI application deployment-control planning.
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  title: AI-Ops Service Control API
  version: "0.1"
paths:
  /api/v1/agents:
    get:
      description: Return the configured bounded-action agent registry.
      operationId: GetAgents
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: List registered AI operation agents
      tags:
      - Agent Registry
    post:
      consumes:
      - application/json
      description: Register an external agent endpoint, capabilities, and bounded
        actions in process memory.
      operationId: PostAgent
      parameters:
      - description: External agent registration
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.ExternalAgentRegistrationRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/api.AgentProfile'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: Register an external AI operation agent
      tags:
      - Agent Registry
  /api/v1/agents/{name}:
    delete:
      description: Delete only an Agent registered in process memory. Configuration-backed
        Agents are protected.
      operationId: DeleteAgent
      parameters:
      - description: Agent name
        in: path
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: Delete a runtime AI operation agent
      tags:
      - Agent Registry
    get:
      operationId: GetAgent
      parameters:
      - description: Agent name
        in: path
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.AgentProfile'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: Get a registered AI operation agent
      tags:
      - Agent Registry
  /api/v1/agents/{name}/actions/{action}/validate:
    post:
      operationId: PostAgentActionValidate
      parameters:
      - description: Agent name
        in: path
        name: name
        required: true
        type: string
      - description: Action identifier
        in: path
        name: action
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: Validate an action against an agent boundary
      tags:
      - Agent Registry
  /api/v1/agents/{name}/invocations/plan:
    post:
      consumes:
      - application/json
      description: Validate the registered capability and bounded action, then return
        a non-executing invocation plan.
      operationId: PostAgentInvocationPlan
      parameters:
      - description: Agent name
        in: path
        name: name
        required: true
        type: string
      - description: Invocation plan request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.AgentInvocationPlanRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.AgentInvocationPlan'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: Build a validated external-agent invocation plan
      tags:
      - Agent Registry
  /api/v1/apps/deployment-plan:
    post:
      consumes:
      - application/json
      description: Build a non-executing, capability-based handoff plan for any registered
        external execution agent.
      operationId: PostDeploymentPlan
      parameters:
      - description: VM compatibility request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.VMCompatibilityRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.DeploymentPlanResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: Build an AI application deployment plan
      tags:
      - AI Application Deployment
  /api/v1/apps/vm-suitability:
    post:
      consumes:
      - application/json
      description: Validate whether an infrastructure-supplied VM snapshot satisfies
        declared workload requirements without selecting or provisioning a VM.
      operationId: PostVMSuitability
      parameters:
      - description: VM compatibility request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.VMCompatibilityRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.VMCompatibilityResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: Validate a provided CPU/GPU VM
      tags:
      - AI Application Deployment
  /api/v1/automation/action-proposals:
    post:
      consumes:
      - application/json
      description: Call an actual configured LLM candidate, validate its bounded Action
        against actual VM evidence and Agent Registry policy, and return a non-executing
        external-agent handoff.
      operationId: PostLLMAutomationAction
      parameters:
      - description: LLM automation Action request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.LLMAutomationActionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.LLMAutomationActionResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: Generate and validate an LLM-based automation Action
      tags:
      - AI Application Automation
  /api/v1/automation/feedback:
    post:
      consumes:
      - application/json
      description: Record normalized status and optional performance evidence for
        a previously approved correlation ID. Credentials and arbitrary secret fields
        are not accepted.
      operationId: PostAutomationFeedback
      parameters:
      - description: Automation execution feedback
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.AutomationFeedbackRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.AutomationFeedbackRecord'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: Record external automation execution feedback
      tags:
      - AI Application Automation
  /api/v1/autonomy/events:
    delete:
      description: Clear only the in-memory event timeline. Loop configuration, runtime
        state, cooldown, and Action budget are preserved.
      operationId: DeleteAutonomyEvents
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: Clear guarded autonomous loop events
      tags:
      - Autonomous Loop
  /api/v1/ops-llm/select:
    post:
      consumes:
      - application/json
      description: Rank Ops LLM candidates using the configured service-control benchmark
        policy.
      operationId: PostOpsLLMSelect
      parameters:
      - description: Ops LLM selection request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.OpsLLMSelectRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.OpsLLMSelectionResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: Select an Ops LLM policy candidate
      tags:
      - LLM Operation Management
  /api/v1/planner/deployments:
    post:
      consumes:
      - application/json
      description: Validate the request with Go Request Guard, use an actual configured
        LLM to generate an AppDeploy DeploymentManifest, validate it with Go Manifest
        Guard, submit it to AppDeploy, and poll the deployment status. AppDeploy retains
        target selection and execution responsibility.
      operationId: PostAppDeployPlanner
      parameters:
      - description: Planner request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.AppDeployPlannerRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: Plan and submit an AI application deployment
      tags:
      - AI Application Automation
  /api/v1/service-operations/run:
    post:
      consumes:
      - application/json
      description: Execute the Go service-control flow across LLM selection, agent
        checks, actual VM suitability validation, and generic deployment-control handoff
        planning.
      operationId: PostServiceOperationsRun
      parameters:
      - description: Service operation request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.ServiceOperationsRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.ServiceOperationsResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: Run service-control operation planning
      tags:
      - Service Control
  /healthz:
    get:
      description: Return a lightweight readiness response for the Go service-control
        API.
      operationId: GetHealthz
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Check service-control API health
      tags:
      - Service Control
