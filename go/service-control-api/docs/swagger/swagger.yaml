  /api/v1/control-runs/from-package:
    post:
      consumes:
      - multipart/form-data
      description: |-
        Accept application source as multipart form data, invoke AppDeploy packaging and registration, then run the existing guarded ControlRun planning workflow.
        Successful Package and App registration results remain in application and partial_result after a later Planner or Guard failure and are not automatically rolled back. AppDeploy submission remains a separate explicit request.
      operationId: CreateControlRunFromPackage
      parameters:
      - description: Application source file or source archive
        in: formData
        name: source
        required: true
        type: file
      - description: Package type
        in: formData
        name: package_type
        required: true
        type: string
      - description: Application name
        in: formData
        name: app_name
        required: true
        type: string
      - description: Application version
        in: formData
        name: app_version
        required: true
        type: string
      - description: Application entrypoint
        in: formData
        name: entrypoint
        required: true
        type: string
      - description: 'Runtime type: cpu or gpu'
        in: formData
        name: runtime_type
        required: true
        type: string
      - description: Application service port
        in: formData
        name: service_port
        type: integer
      - description: HTTP healthcheck path
        in: formData
        name: healthcheck_path
        type: string
      - description: Deployment planning request
        in: formData
        name: natural_language_request
        required: true
        type: string
      - description: Configured Planner candidate
        in: formData
        name: candidate_id
        required: true
        type: string
      - default: ai-agent
        description: Trusted requester; defaults to ai-agent
        in: formData
        name: requested_by
        type: string
      - description: Manifest Planner Agent
        in: formData
        name: agent_name
        type: string
      - description: AppDeploy Target hint; AppDeploy performs final Target selection
        in: formData
        name: target_profile_id
        type: string
      - description: CPU requirement
        in: formData
        name: cpu
        required: true
        type: string
      - description: Memory requirement
        in: formData
        name: memory
        required: true
        type: string
      - description: GPU requirement
        in: formData
        name: gpu
        required: true
        type: string
      - description: Storage requirement
        in: formData
        name: storage
        required: true
        type: string
      - description: Cost policy; empty or min_cost
        enum:
        - min_cost
        in: formData
        name: cost_policy
        type: string
      produces:
      - application/json
      responses:
        "201":
          description: Package and App registered; DeploymentManifest approved
          schema:
            $ref: '#/definitions/controlrun.Run'
        "400":
          description: Malformed multipart or field validation returns api.ErrorResponse;
            Request Guard rejection returns controlrun.Run
          schema:
            $ref: '#/definitions/api.PackageControlRunErrorResponse'
        "403":
          description: Agent Registry or bounded Action rejection
          schema:
            $ref: '#/definitions/controlrun.Run'
        "413":
          description: Upload exceeds AIOPS_APP_UPLOAD_MAX_BYTES
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "422":
          description: Planner or Manifest Guard rejection with partial results preserved
          schema:
            $ref: '#/definitions/controlrun.Run'
        "500":
          description: Pre-ControlRun setup failures return api.ErrorResponse; unexpected
            ControlRun states return controlrun.Run
          schema:
            $ref: '#/definitions/api.PackageControlRunErrorResponse'
        "502":
          description: AppDeploy Package or App registration failure with available
            partial results preserved
          schema:
            $ref: '#/definitions/controlrun.Run'
      summary: Package and register an application before generating a guarded DeploymentManifest
      tags:
      - AI Application Automation
