openapi: 3.0.3
info:
  title: KHU AI App Deployer API
  version: "1.0.0"
  description: |
    CPU/GPU VM 기반 AI 응용 등록·배포 프로토타입 API.

    이 API는 AI App Spec 등록·조회·등록 삭제, Runtime Credential과 Runtime/Target Profile 등록·조회·삭제,
    자원 readiness 점검, 배포 요청, 상태 조회, 로그 조회, 중지 요청을 제공한다.

    1차년도 범위는 CPU VM, NVIDIA GPU VM, AI-Infra 연동 준비(Mock/Fixture)이며
    Docker, Kubernetes, OCI Image, Container Registry 기반 배포는 포함하지 않는다.
  license:
    name: Internal research prototype
servers:
  - url: /api/v1
    description: Version 1 API prefix
security: []
tags:
  - name: System
    description: 서버 생존 상태와 준비 상태를 확인한다.
  - name: Credentials
    description: 프로세스 메모리 전용 SSH Credential을 등록·조회·삭제한다. Secret은 응답, 로그, 영속 저장소에 노출하지 않는다.
  - name: App Registry
    description: AI App Spec을 등록·조회하고, 참조 Deployment가 없거나 모두 STOPPED인 등록 정보를 삭제한다.
  - name: Artifacts
    description: 서버 프리셋 또는 업로드한 소스를 배포 가능한 package artifact로 생성한다.
  - name: Profiles
    description: Runtime Profile과 Target Profile을 등록·조회·삭제한다. 삭제 시 STOPPED가 아닌 Deployment 참조를 보호하고 보존 이력은 유지한다.
  - name: Resources
    description: Target 자원 readiness와 최근 inventory를 확인한다.
  - name: Deployments
    description: AI App 배포 요청, 상태 조회, 로그 조회, 중지 요청을 처리한다.
  - name: Inference
    description: Running deployment inference proxy endpoints.
  - name: Monitoring
    description: Deployment 상태, Runtime health, 알람 요약을 조회한다.
paths:
  /healthz:
    get:
      tags: [System]
      operationId: getHealthz
      summary: Process liveness check
      description: |
        API 서버 프로세스가 살아 있는지 확인한다.
        저장소, Runtime Adapter, 외부 API 연결 상태는 검사하지 않는다.
      responses:
        "200":
          description: 서버 프로세스가 정상적으로 응답한다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /readiness:
    get:
      tags: [System]
      operationId: getReadiness
      summary: Readiness check for repository, runtime, target, and external adapters
      description: |
        저장소, Runtime Adapter, 외부 API Mock/Fixture 준비 상태를 반환한다.
        현재 외부 API는 실제 호출이 아니라 ETRI AI-Infra Mock 경로를 기준으로 표시한다.
      responses:
        "200":
          description: 서버가 처리 가능한 의존성 준비 상태를 반환한다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
  /credentials:
    post:
      tags: [Credentials]
      operationId: createCredential
      summary: Register an in-memory SSH credential
      description: |
        SSH Credential과 신뢰 가능한 경로에서 확인한 OpenSSH SHA256 host key fingerprint를 프로세스 메모리에 등록하고
        `cred://runtime/{credential_id}` 참조를 반환한다. SSH 연결은 이 fingerprint와 일치하는 서버만 허용한다.
        Secret은 응답, 로그, 일반 파일 저장소에 기록하지 않으며 서버 재시작 시 등록 정보가 소멸한다.
        기본적으로 TCP peer와 HTTP Host가 모두 loopback인 요청만 허용하고, Origin이 있으면 Host와 같은 origin이어야 한다.
        `AIAPP_CREDENTIAL_API_ALLOW_REMOTE=true`를 명시한 경우에만 원격 peer/Host를 허용하며, 운영 환경의 원격 사용은
        TLS와 인증을 적용한 reverse proxy를 전제로 한다. POST 본문은 application/json만 허용한다.
      requestBody:
        required: true
        description: SSH private key 또는 password 중 auth_type에 맞는 Secret을 포함한다. Secret 값은 문서 예제에 포함하지 않는다.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialCreateRequest'
      responses:
        "201":
          description: 메모리 전용 Credential이 등록되었다. 응답에는 Secret이 포함되지 않는다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialResponse'
        "400":
          description: Content-Type, 필수 필드, credential_id, auth_type, host key fingerprint, SSH 인증 입력 또는 개별 Secret 필드의 최대 길이가 올바르지 않다. 오류 코드는 TARGET_PROFILE_INVALID이다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "403":
          description: 허용되지 않은 peer/Host/Origin의 요청이다. 오류 코드는 GATEWAY_AUTH_FAILED이다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "409":
          description: 같은 credential_id가 이미 등록되어 있다. 오류 코드는 TARGET_PROFILE_INVALID이다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "413":
          description: 전체 Credential JSON 요청 본문이 128 KiB 제한을 초과했다. 오류 코드는 TARGET_PROFILE_INVALID이다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      tags: [Credentials]
      operationId: listCredentials
      summary: List in-memory SSH credential metadata
      description: |
        현재 프로세스 메모리에 등록된 `cred://runtime/` Credential 메타데이터만 반환한다.
        Secret은 반환하지 않으며 환경변수 기반 Credential은 목록에 포함하지 않는다.
        기본 loopback peer/Host, same-origin 제한과 원격 opt-in 조건은 등록 API와 동일하다.
      responses:
        "200":
          description: 메모리 전용 Credential 메타데이터 목록.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialListResponse'
        "403":
          description: 허용되지 않은 peer/Host/Origin의 요청이다. 오류 코드는 GATEWAY_AUTH_FAILED이다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /credentials/{credential_id}:
    delete:
      tags: [Credentials]
      operationId: deleteCredential
      summary: Delete an in-memory SSH credential
      description: |
        지정한 `cred://runtime/{credential_id}` Credential을 프로세스 메모리에서 삭제한다.
        Target Profile의 참조 여부와 관계없이 Profile과 독립적으로 삭제할 수 있다. Target Profile 삭제도
        Runtime Credential을 연쇄 삭제하지 않는다. 삭제 후 SSH Runner를 사용하는 다음 실제 VM 연결은
        Credential 누락으로 실패한다. dry-run은 원격 연결이나
        Credential 해석을 수행하지 않는다. 환경변수 기반 Credential에는 영향을 주지 않는다.
      parameters:
        - name: credential_id
          in: path
          required: true
          description: 삭제할 메모리 전용 Credential ID.
          schema:
            type: string
            minLength: 2
            maxLength: 63
            pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
      responses:
        "200":
          description: Credential이 메모리에서 삭제되었다. 삭제 결과만 반환하고 Secret은 반환하지 않는다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialDeleteResponse'
        "400":
          description: credential_id 형식이 올바르지 않다. 오류 코드는 TARGET_PROFILE_INVALID이다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "403":
          description: 허용되지 않은 peer/Host/Origin의 요청이다. 오류 코드는 GATEWAY_AUTH_FAILED이다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "404":
          description: 지정한 credential_id가 현재 프로세스 메모리에 없다. 오류 코드는 NOT_FOUND이다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /artifacts/packages:
    post:
      tags: [Artifacts]
      operationId: buildArtifactPackage
      summary: Build a package artifact from a preset or uploaded source
      description: |
        JSON 요청은 서버에 설정된 ai-ops-geon 프리셋을 Linux amd64 tar.gz package로 생성한다.
        multipart 요청은 Go, Python, Node.js, Linux binary, Shell script 유형의 소스 ZIP 또는 단일 파일을 업로드해 package로 생성한다.
        임의의 서버 소스 경로나 build command는 받지 않고 유형별 고정 build/entrypoint 규칙만 사용한다.
        응답의 artifact_uri와 app_spec은 Web, CLI, Shell client에서 App 등록 또는 `POST /apps`에 바로 사용할 수 있다.
        Package 기반 배포 client는 응답의 app_spec 등록과 Target resource check를 조합하고, check status가 available일 때만 deployment를 생성한다.
      requestBody:
        description: 서버 프리셋 또는 업로드 소스와 App 등록 기본값.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PackageBuildRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UploadedPackageBuildRequest'
      responses:
        "201":
          description: Package 생성이 완료되었다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PackageBuildResponse'
        "400":
          description: 지원하지 않는 유형이거나 App 이름, version, entrypoint 또는 service port가 올바르지 않다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "404":
          description: 서버 프리셋 소스, 업로드 소스 또는 지정한 entrypoint가 없다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "413":
          description: 업로드한 source 파일이 서버의 크기 제한을 초과했다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          description: 유형별 build 또는 package archive 생성이 완료되지 않았다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "504":
          description: 설정된 시간 안에 package build가 완료되지 않았다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /apps:
    post:
      tags: [App Registry]
      operationId: createApp
      summary: Register AI App
      description: |
        AI App Spec을 등록하고 app_id와 app_version_id를 발급한다.
        artifact.type은 package, git, binary, script만 허용하며 container는 1차년도 범위에서 거부한다.
      requestBody:
        description: 등록할 AI App Spec.
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/AppCreateRequest'
                - $ref: '#/components/schemas/AppSpec'
              description: 기존 app_spec 래퍼와 외부 제공 인터페이스의 직접 AppSpec 본문을 모두 허용한다.
      responses:
        "201":
          description: App Spec 등록이 완료되었다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppResponse'
        "400":
          description: App Spec 필수 필드 누락, artifact type 오류, 중복 name/version 등으로 등록에 실패했다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      tags: [App Registry]
      operationId: listApps
      summary: List AI Apps
      description: 등록된 AI App 버전 목록을 반환한다.
      responses:
        "200":
          description: 등록된 AI App 목록.
          content:
            application/json:
              schema:
                type: object
                description: AI App 목록 응답.
                properties:
                  items:
                    type: array
                    description: 등록된 AI App 버전 배열.
                    items:
                      $ref: '#/components/schemas/AppResponse'
  /apps/{app_id}:
    get:
      tags: [App Registry]
      operationId: getApp
      summary: Get AI App
      description: app_id로 등록된 AI App 정보를 조회한다.
      parameters:
        - name: app_id
          in: path
          description: 조회할 AI App ID.
          required: true
          schema:
            type: string
      responses:
        "200":
          description: AI App 상세 정보.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppResponse'
        "404":
          description: 지정한 app_id가 존재하지 않는다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [App Registry]
      operationId: deleteApp
      summary: Delete AI App registration
      description: |
        app_id가 가리키는 단일 AI App 버전 등록 정보를 App Registry에서 삭제한다.
        해당 app_id 또는 app_version_id를 참조하는 Deployment가 없거나 모두 STOPPED이면 삭제할 수 있다.
        STOPPED Deployment 이력은 유지하며, STOPPED 이외 상태의 참조가 하나라도 있으면 삭제하지 않는다.
        artifact URI가 가리키는 package, git, binary, script 원본과 VM에 배포된 파일은 삭제하지 않는다.
      parameters:
        - name: app_id
          in: path
          description: 등록 삭제할 AI App ID.
          required: true
          schema:
            type: string
      responses:
        "200":
          description: App Registry 등록 정보가 삭제되었다. STOPPED Deployment 이력과 artifact는 유지된다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppDeleteResponse'
        "404":
          description: 지정한 app_id가 존재하지 않는다. 오류 코드는 NOT_FOUND이다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "409":
          description: STOPPED 이외 상태의 Deployment가 App 또는 App Version을 참조한다. 오류 코드는 APP_SPEC_INVALID이다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          description: App Registry 저장 중 예기치 않은 오류가 발생했다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /runtime-profiles:
    post:
      tags: [Profiles]
      operationId: createRuntimeProfile
      summary: Register Runtime Profile
      description: |
        배포 실행 방식과 Runtime Adapter를 정의하는 Runtime Profile을 등록한다.
        CPU VM은 cpu/cpu_vm, GPU VM은 gpu/gpu_vm, AI-Infra 연동 준비는 aiinfra/etri_aiinfra 조합을 사용한다.
      requestBody:
        description: 등록할 Runtime Profile.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuntimeProfile'
      responses:
        "201":
          description: Runtime Profile 등록이 완료되었다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeProfile'
    get:
      tags: [Profiles]
      operationId: listRuntimeProfiles
      summary: List Runtime Profiles
      description: 등록된 Runtime Profile 목록을 반환한다.
      responses:
        "200":
          description: Runtime Profile 목록.
          content:
            application/json:
              schema:
                type: object
                description: Runtime Profile 목록 응답.
                properties:
                  items:
                    type: array
                    description: 등록된 Runtime Profile 배열.
                    items:
                      $ref: '#/components/schemas/RuntimeProfile'
  /runtime-profiles/{runtime_profile_id}:
    delete:
      tags: [Profiles]
      operationId: deleteRuntimeProfile
      summary: Delete Runtime Profile registration
      description: |
        지정한 Runtime Profile 등록 정보를 삭제한다. 해당 Profile을 참조하는 Deployment가 없거나
        모두 STOPPED인 경우에만 삭제하며 STOPPED Deployment, Event, Metric 이력은 유지한다.
        Target Profile과 Runtime Credential은 연쇄 삭제하지 않는다.
      parameters:
        - name: runtime_profile_id
          in: path
          required: true
          description: 삭제할 Runtime Profile ID.
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Runtime Profile 등록 정보가 삭제되었다. 보존 이력과 Target/Credential은 유지된다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileDeleteResponse'
        "404":
          description: 지정한 Runtime Profile이 없다. 오류 코드는 NOT_FOUND이다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "409":
          description: STOPPED가 아닌 Deployment가 Runtime Profile을 참조한다. 오류 코드는 RUNTIME_PROFILE_INVALID이다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /target-profiles:
    post:
      tags: [Profiles]
      operationId: createTargetProfile
      summary: Register Target Profile
      description: |
        배포 대상 VM, GPU, 저장소, Runtime 정보를 담은 Target Profile을 등록한다.
        실제 Secret 값은 넣지 않고 credential_ref만 저장한다.
      requestBody:
        description: 등록할 Target Profile.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TargetProfile'
      responses:
        "201":
          description: Target Profile 등록이 완료되었다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TargetProfile'
    get:
      tags: [Profiles]
      operationId: listTargetProfiles
      summary: List Target Profiles
      description: 등록된 Target Profile 목록을 반환한다.
      responses:
        "200":
          description: Target Profile 목록.
          content:
            application/json:
              schema:
                type: object
                description: Target Profile 목록 응답.
                properties:
                  items:
                    type: array
                    description: 등록된 Target Profile 배열.
                    items:
                      $ref: '#/components/schemas/TargetProfile'
  /target-profiles/{target_profile_id}:
    delete:
      tags: [Profiles]
      operationId: deleteTargetProfile
      summary: Delete Target Profile registration
      description: |
        지정한 Target Profile 등록 정보를 삭제한다. 해당 Profile을 참조하는 Deployment가 없거나
        모두 STOPPED인 경우에만 삭제하며 STOPPED Deployment, Event, Metric 이력은 유지한다.
        Target의 현재 Resource Inventory snapshot이 있으면 함께 제거하지만 Runtime Credential은 연쇄 삭제하지 않는다.
      parameters:
        - name: target_profile_id
          in: path
          required: true
          description: 삭제할 Target Profile ID.
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Target Profile 등록 정보가 삭제되고 현재 Inventory snapshot이 있으면 함께 제거되었다. 보존 이력과 Credential은 유지된다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileDeleteResponse'
        "404":
          description: 지정한 Target Profile이 없다. 오류 코드는 NOT_FOUND이다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "409":
          description: STOPPED가 아닌 Deployment가 Target Profile을 참조한다. 오류 코드는 TARGET_PROFILE_INVALID이다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /resources/check:
    post:
      tags: [Resources]
      operationId: checkResource
      summary: Check target resource readiness
      description: |
        Target Profile 기준으로 Runtime Adapter readiness를 확인한다.
        CPU VM은 VM 접근성, GPU VM은 nvidia-smi, AI-Infra는 ETRI Mock/Fixture readiness 경로를 확인한다.
      requestBody:
        description: readiness를 확인할 Target Profile ID.
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Target 자원 readiness 확인 요청.
              required: [target_profile_id]
              properties:
                runtime_profile_id:
                  type: string
                  description: 외부 인터페이스 호환용 Runtime Profile ID. 현재 readiness는 target_profile_id 기준으로 수행한다.
                target_profile_id:
                  type: string
                  description: 확인할 Target Profile ID.
                checks:
                  type: array
                  description: 외부 인터페이스 호환용 점검 항목 목록.
                  items:
                    type: string
                    enum: [connectivity, storage, gpu, runtime]
      responses:
        "200":
          description: Target 자원 readiness 결과.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceCheckResponse'
  /resources/inventory:
    get:
      tags: [Resources]
      operationId: listResourceInventory
      summary: List recent resource inventory
      description: "최근 `/resources/check` 호출로 저장된 Target별 Resource Inventory를 반환한다."
      responses:
        "200":
          description: 최근 Resource Inventory 목록.
          content:
            application/json:
              schema:
                type: object
                description: Resource Inventory 목록 응답.
                properties:
                  items:
                    type: array
                    description: Target별 최근 자원 점검 결과.
                    items:
                      $ref: '#/components/schemas/ResourceInventory'
  /deployments:
    post:
      tags: [Deployments]
      operationId: createDeployment
      summary: Create deployment
      description: |
        app_version_id, runtime_profile_id, target_profile_id 조합으로 배포를 요청한다.
        상태는 REQUESTED, VALIDATING, VALIDATED, SCHEDULING, DEPLOYING, RUNNING 순서로 전이된다.
        실패 시 표준 상태와 ErrorResponse 코드로 정규화된다.
      requestBody:
        description: 배포 요청 본문.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeploymentCreateRequest'
      responses:
        "202":
          description: 배포 요청이 수락되었고 현재 상태를 반환한다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeploymentResponse'
    get:
      tags: [Deployments]
      operationId: listDeployments
      summary: List deployments
      description: 생성된 Deployment 목록과 현재 상태를 반환한다.
      responses:
        "200":
          description: Deployment 목록.
          content:
            application/json:
              schema:
                type: object
                description: Deployment 목록 응답.
                properties:
                  items:
                    type: array
                    description: 생성된 Deployment 배열.
                    items:
                      $ref: '#/components/schemas/DeploymentResponse'
  /deployments/{deployment_id}:
    get:
      tags: [Deployments]
      operationId: getDeployment
      summary: Get deployment status
      description: Deployment ID로 현재 배포 상태를 조회한다.
      parameters:
        - name: deployment_id
          in: path
          description: 조회할 Deployment ID.
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deployment 현재 상태.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeploymentResponse'
  /deployments/{deployment_id}/logs:
    get:
      tags: [Deployments]
      operationId: getDeploymentLogs
      summary: Get deployment logs
      description: |
        DeploymentEvent와 Runtime Adapter 로그를 함께 반환한다.
        stage query를 지정하면 특정 상태/단계 로그만 조회할 수 있다.
      parameters:
        - name: deployment_id
          in: path
          description: 로그를 조회할 Deployment ID.
          required: true
          schema:
            type: string
        - name: stage
          in: query
          description: "필터링할 배포 단계. 예: DEPLOYING, RUNNING, STOPPED."
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Deployment 로그 목록.
          content:
            application/json:
              schema:
                type: object
                description: Deployment 로그 목록 응답.
                properties:
                  request_id:
                    type: string
                    description: 요청 추적 ID.
                    example: req-test-001
                  deployment_id:
                    type: string
                    description: 로그를 조회한 Deployment ID.
                  items:
                    type: array
                    description: DeploymentEvent와 Runtime Adapter 로그 배열.
                    items:
                      $ref: '#/components/schemas/DeploymentLog'
                  logs:
                    type: array
                    description: 외부 인터페이스 호환용 로그 배열 alias.
                    items:
                      $ref: '#/components/schemas/DeploymentLog'
  /deployments/{deployment_id}/metrics:
    post:
      tags: [Monitoring]
      operationId: createDeploymentMetric
      summary: Record deployment inference metric
      description: Store an inference or operation metric sample for a deployment. This is a year-1 placeholder path for latency, throughput, quality, and counters.
      parameters:
        - name: deployment_id
          in: path
          description: Deployment ID for the metric sample.
          required: true
          schema:
            type: string
      requestBody:
        description: Inference metric sample.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InferenceMetricCreateRequest'
      responses:
        "201":
          description: Metric sample stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InferenceMetricRecord'
        "400":
          description: Invalid metric sample.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      tags: [Monitoring]
      operationId: listDeploymentMetrics
      summary: List deployment inference metrics
      description: Return metric samples recorded for a deployment.
      parameters:
        - name: deployment_id
          in: path
          description: Deployment ID.
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deployment metric samples.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/InferenceMetricRecord'
  /deployments/{deployment_id}/stop:
    post:
      tags: [Deployments]
      operationId: stopDeployment
      summary: Stop deployment
      description: |
        실행 중인 Deployment에 중지 요청을 보내고 CPU/GPU VM Adapter가 원격 VM의 배포 프로세스를 종료한 뒤 STOPPING, STOPPED 상태 전이를 기록한다.
        이미 STOPPED인 Deployment는 Runtime Adapter를 다시 호출하지 않고 현재 상태를 그대로 반환한다.
      parameters:
        - name: deployment_id
          in: path
          description: 중지할 Deployment ID.
          required: true
          schema:
            type: string
      responses:
        "202":
          description: 원격 프로세스 종료 요청이 완료되었거나 이미 STOPPED이며, 현재 Deployment 상태를 반환한다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeploymentResponse'
  /inference/{deployment_id}/health:
    get:
      tags: [Inference]
      operationId: getInferenceHealth
      summary: Check deployed inference app health
      description: Calls `/health` inside the target VM for a running deployment and returns the proxied response.
      parameters:
        - name: deployment_id
          in: path
          description: Running deployment ID.
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Proxied inference health response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InferenceInvokeResponse'
        "409":
          description: Deployment is not RUNNING.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /inference/{deployment_id}/invoke:
    post:
      tags: [Inference]
      operationId: invokeInference
      summary: Invoke a deployed inference app
      description: Proxies an inference request to the app HTTP server running inside the target VM. The target port defaults to the first App Spec network port.
      parameters:
        - name: deployment_id
          in: path
          description: Running deployment ID.
          required: true
          schema:
            type: string
      requestBody:
        description: Inference proxy request.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InferenceInvokeRequest'
      responses:
        "200":
          description: Proxied inference response wrapper.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InferenceInvokeResponse'
        "400":
          description: Invalid inference request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "409":
          description: Deployment is not RUNNING.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /monitoring/summary:
    get:
      tags: [Monitoring]
      operationId: getMonitoringSummary
      summary: Get monitoring summary
      description: Deployment 상태 집계, Runtime health snapshot, 알람 요약을 한 번에 조회한다.
      responses:
        "200":
          description: 모니터링 요약.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonitoringSummaryResponse'
  /monitoring/runtime-health:
    get:
      tags: [Monitoring]
      operationId: listRuntimeHealth
      summary: List runtime health snapshots
      description: 최근 resource check로 저장된 Target별 Runtime health snapshot을 반환한다.
      responses:
        "200":
          description: Runtime health 목록.
          content:
            application/json:
              schema:
                type: object
                description: Runtime health 목록 응답.
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/RuntimeHealthSnapshot'
  /monitoring/alarms:
    get:
      tags: [Monitoring]
      operationId: listDeploymentAlarms
      summary: List deployment alarms
      description: DeploymentEvent의 ERROR 로그와 error_code를 표준 알람 요약으로 반환한다.
      responses:
        "200":
          description: 알람 요약 목록.
          content:
            application/json:
              schema:
                type: object
                description: 알람 목록 응답.
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/DeploymentAlarmSummary'
  /monitoring/metrics:
    get:
      tags: [Monitoring]
      operationId: listInferenceMetrics
      summary: List all inference metrics
      description: Return all recorded inference and operation metric samples across deployments.
      responses:
        "200":
          description: Metric sample list.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/InferenceMetricRecord'
components:
  schemas:
    HealthResponse:
      type: object
      description: 서버 생존 상태 응답.
      properties:
        request_id:
          type: string
          description: 요청 추적 ID.
          example: req-test-001
        status:
          type: string
          description: 생존 상태. 구현체는 항상 ok를 반환한다.
          example: ok
    ReadinessResponse:
      type: object
      description: 저장소, Runtime Adapter, 외부 API Mock 준비 상태 응답.
      properties:
        request_id:
          type: string
          description: 요청 추적 ID.
          example: req-test-001
        status:
          type: string
          description: 서버 준비 상태.
          enum: [ready, degraded, not_ready]
          example: ready
        checks:
          type: object
          description: 구현체가 노출하는 준비 상태 상세. 현재 runtime_adapter는 mock,cpu_vm,gpu_vm,etri_aiinfra를 반환한다.
          additionalProperties:
            type: string
          example:
            repository: ready
            runtime_adapter: mock,cpu_vm,gpu_vm,etri_aiinfra
            external_api: etri_mock
    CredentialCreateRequest:
      type: object
      additionalProperties: false
      description: |
        프로세스 메모리에 등록할 SSH Credential. auth_type에 따라 private_key 또는 password 중 하나만 전달한다.
        host_key_fingerprint는 신뢰 가능한 채널로 확인한 대상 SSH 서버 공개키의 canonical OpenSSH SHA256 fingerprint이다.
        Secret 필드는 writeOnly이며 응답, 로그, 일반 파일 저장소에 기록하지 않는다.
      required: [credential_id, credential_type, auth_type, ssh_user, host_key_fingerprint]
      oneOf:
        - required: [private_key]
          properties:
            auth_type:
              enum: [private_key]
          not:
            properties:
              password: {}
            required: [password]
        - required: [password]
          properties:
            auth_type:
              enum: [password]
          not:
            anyOf:
              - properties:
                  private_key: {}
                required: [private_key]
              - properties:
                  private_key_passphrase: {}
                required: [private_key_passphrase]
      properties:
        credential_id:
          type: string
          minLength: 2
          maxLength: 63
          pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
          description: 소문자 영숫자와 단일 하이픈 구분자로 구성된 프로세스 내 Credential ID.
          example: cpu-vm-001
        credential_type:
          type: string
          enum: [ssh]
          description: 현재 지원하는 Credential 종류.
        auth_type:
          type: string
          enum: [private_key, password]
          description: SSH 인증 방식. 선택한 방식에 해당하는 Secret만 전달한다.
        ssh_user:
          type: string
          minLength: 1
          maxLength: 128
          description: SSH 사용자 이름.
          example: ubuntu
        host_key_fingerprint:
          type: string
          minLength: 50
          maxLength: 50
          pattern: '^SHA256:[A-Za-z0-9+/]{43}$'
          description: 신뢰 가능한 채널에서 확인한 대상 SSH host public key의 canonical OpenSSH SHA256 fingerprint. Secret이 아니며 응답과 목록에도 반환된다.
          example: SHA256:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
        private_key:
          type: string
          minLength: 1
          maxLength: 65536
          writeOnly: true
          description: auth_type=private_key일 때 전달하는 PEM private key 원문. 응답과 로그에 포함하지 않는다.
        private_key_passphrase:
          type: string
          minLength: 1
          maxLength: 4096
          writeOnly: true
          description: 암호화된 private key의 선택적 passphrase. 응답과 로그에 포함하지 않는다.
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 4096
          writeOnly: true
          description: auth_type=password일 때 전달하는 SSH password. 응답과 로그에 포함하지 않는다.
        ssh_timeout_seconds:
          type: integer
          minimum: 1
          maximum: 300
          default: 30
          description: SSH 연결 timeout 초.
    CredentialRecord:
      type: object
      additionalProperties: false
      description: Secret을 제외한 프로세스 메모리 Credential 메타데이터.
      required: [credential_id, credential_ref, credential_type, auth_type, ssh_user, host_key_fingerprint, ssh_timeout_seconds, persistent, created_at]
      properties:
        credential_id:
          type: string
          minLength: 2
          maxLength: 63
          pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
          example: cpu-vm-001
        credential_ref:
          type: string
          pattern: '^cred://runtime/[a-z0-9]+(?:-[a-z0-9]+)*$'
          readOnly: true
          description: Target Profile에서 사용할 메모리 전용 Credential 참조.
          example: cred://runtime/cpu-vm-001
        credential_type:
          type: string
          enum: [ssh]
        auth_type:
          type: string
          enum: [private_key, password]
        ssh_user:
          type: string
          minLength: 1
          maxLength: 128
          example: ubuntu
        host_key_fingerprint:
          type: string
          minLength: 50
          maxLength: 50
          pattern: '^SHA256:[A-Za-z0-9+/]{43}$'
          description: SSH 서버 인증에 사용하는 공개 host key fingerprint.
          example: SHA256:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
        ssh_timeout_seconds:
          type: integer
          minimum: 1
          maximum: 300
          example: 30
        persistent:
          type: boolean
          enum: [false]
          readOnly: true
          description: 프로세스 메모리 전용이므로 항상 false이며 서버 재시작 시 소멸한다.
        created_at:
          type: string
          format: date-time
          readOnly: true
          description: 현재 프로세스에서 Credential을 등록한 시각(UTC).
    CredentialResponse:
      type: object
      additionalProperties: false
      description: 단일 Credential 작업 응답. Secret은 포함하지 않는다.
      required: [request_id, credential_id, credential_ref, credential_type, auth_type, ssh_user, host_key_fingerprint, ssh_timeout_seconds, persistent, created_at]
      properties:
        request_id:
          type: string
          description: 요청 추적 ID.
          example: req-test-001
        credential_id:
          type: string
          minLength: 2
          maxLength: 63
          pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
          example: cpu-vm-001
        credential_ref:
          type: string
          pattern: '^cred://runtime/[a-z0-9]+(?:-[a-z0-9]+)*$'
          readOnly: true
          example: cred://runtime/cpu-vm-001
        credential_type:
          type: string
          enum: [ssh]
        auth_type:
          type: string
          enum: [private_key, password]
        ssh_user:
          type: string
          minLength: 1
          maxLength: 128
          example: ubuntu
        host_key_fingerprint:
          type: string
          minLength: 50
          maxLength: 50
          pattern: '^SHA256:[A-Za-z0-9+/]{43}$'
          description: SSH 서버 인증에 사용하는 공개 host key fingerprint.
          example: SHA256:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
        ssh_timeout_seconds:
          type: integer
          minimum: 1
          maximum: 300
          example: 30
        persistent:
          type: boolean
          enum: [false]
          readOnly: true
          description: 프로세스 메모리 전용이므로 항상 false이다.
        created_at:
          type: string
          format: date-time
          readOnly: true
    CredentialListResponse:
      type: object
      additionalProperties: false
      description: 현재 프로세스 메모리에 등록된 Credential 메타데이터 목록. 환경변수 기반 Credential은 포함하지 않는다.
      required: [request_id, items]
      properties:
        request_id:
          type: string
          description: 요청 추적 ID.
          example: req-test-001
        items:
          type: array
          items:
            $ref: '#/components/schemas/CredentialRecord'
    CredentialDeleteResponse:
      type: object
      additionalProperties: false
      description: Runtime Credential 삭제 결과. Secret은 포함하지 않는다.
      required: [request_id, credential_id, credential_ref, deleted, deleted_at]
      properties:
        request_id:
          type: string
          description: 요청 추적 ID.
          example: req-test-001
        credential_id:
          type: string
          minLength: 2
          maxLength: 63
          pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
          example: cpu-vm-001
        credential_ref:
          type: string
          pattern: '^cred://runtime/[a-z0-9]+(?:-[a-z0-9]+)*$'
          readOnly: true
          example: cred://runtime/cpu-vm-001
        deleted:
          type: boolean
          enum: [true]
          readOnly: true
        deleted_at:
          type: string
          format: date-time
          readOnly: true
    PackageBuildRequest:
      type: object
      description: 서버에 등록된 package build preset 실행 요청. 업로드 패키지는 multipart/form-data를 사용한다.
      required: [preset]
      properties:
        preset:
          type: string
          enum: [aiops-geon-service-control]
          description: 서버 설정으로 소스와 build target이 제한된 package preset.
          example: aiops-geon-service-control
        app_version:
          type: string
          pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$'
          description: 생성된 App Spec의 version. 생략하면 web-YYYYMMDD-HHMMSS-mmm 형식으로 생성한다.
          example: web-20260713-01
        service_port:
          type: integer
          minimum: 1
          maximum: 65535
          default: 18089
          description: 생성된 App Spec과 원격 service-control API가 사용할 포트.
          example: 18089
    UploadedPackageBuildRequest:
      type: object
      description: 업로드한 소스 ZIP 또는 단일 파일을 유형별 고정 규칙으로 package화하는 요청.
      required: [package_type, source, app_name, entrypoint]
      properties:
        package_type:
          type: string
          enum: [go, python, node, binary, script]
          description: Go는 Linux amd64로 build하고 나머지 유형은 실행에 필요한 소스를 안전하게 묶는다.
          example: go
        source:
          type: string
          format: binary
          description: Go는 ZIP이 필수이며 Python, Node.js, binary, script는 ZIP 또는 단일 파일을 허용한다. 최대 크기는 서버 설정을 따른다.
        app_name:
          type: string
          pattern: '^[a-z0-9][a-z0-9-]{1,62}$'
          description: 생성된 App Spec의 metadata.name.
          example: my-go-api
        app_version:
          type: string
          pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$'
          description: 생성된 App Spec의 version. 생략하면 web-YYYYMMDD-HHMMSS-mmm 형식으로 생성한다.
          example: 0.1.0
        entrypoint:
          type: string
          description: "Go는 go.mod 기준 build package 경로(예: ./cmd/server), 그 외 유형은 업로드 루트 기준 시작 파일 경로이다."
          example: ./cmd/server
        runtime_type:
          type: string
          enum: [cpu, gpu]
          default: cpu
          description: 생성된 App Spec의 Runtime 종류.
        service_port:
          type: integer
          minimum: 1
          maximum: 65535
          description: HTTP 서비스를 제공할 때 App Spec에 넣을 포트. 생략하면 network와 healthcheck를 만들지 않는다.
          example: 18080
        healthcheck_path:
          type: string
          pattern: '^/[A-Za-z0-9._~!$&''()*+,;=:@%/-]*$'
          default: /health
          description: service_port가 있을 때 사용할 HTTP health 경로.
          example: /health
    PackageBuildResponse:
      type: object
      description: 생성된 package artifact와 App 등록용 App Spec.
      properties:
        request_id:
          type: string
          description: 요청 추적 ID.
          example: req-test-001
        package_type:
          type: string
          enum: [aiops-geon-service-control, go, python, node, binary, script]
          description: 실제 적용된 package 생성 유형.
          example: go
        artifact_uri:
          type: string
          description: CPU/GPU VM SSH Runner가 업로드할 로컬 file URI.
          example: file:///workspace/tmp/appdeploy-web/packages/aiops-geon-service-control-linux-amd64-123.tar.gz
        archive_name:
          type: string
          description: 생성된 tar.gz 파일명.
          example: aiops-geon-service-control-linux-amd64-123.tar.gz
        size_bytes:
          type: integer
          format: int64
          minimum: 1
          description: package archive 크기.
          example: 9045131
        checksum:
          type: string
          description: package archive SHA-256 checksum.
          example: sha256:0123456789abcdef
        created_at:
          type: string
          format: date-time
          description: package 생성 완료 시각(UTC).
        elapsed_ms:
          type: integer
          format: int64
          minimum: 0
          description: build와 archive 생성에 걸린 시간.
          example: 3200
        app_spec:
          $ref: '#/components/schemas/AppSpec'
    AppCreateRequest:
      type: object
      description: AI App 등록 요청.
      required: [app_spec]
      properties:
        app_spec:
          $ref: '#/components/schemas/AppSpec'
    AppResponse:
      type: object
      description: 등록된 AI App 버전 응답.
      properties:
        request_id:
          type: string
          description: 요청 추적 ID.
          example: req-test-001
        app_id:
          type: string
          description: App 단위 식별자.
          example: app-1f4b9d8c-0a7a-4a5f-9f2c-123456789abc
        app_version_id:
          type: string
          description: App name/version 단위 식별자. 배포 요청은 이 값을 사용한다.
          example: appver-1f4b9d8c-0a7a-4a5f-9f2c-123456789abc
        name:
          type: string
          description: App Spec metadata.name.
          example: sample-cpu-app
        version:
          type: string
          description: App Spec metadata.version.
          example: 0.1.0
        app_spec:
          $ref: '#/components/schemas/AppSpec'
        created_at:
          type: string
          format: date-time
          description: 등록 시각(UTC).
          example: "2026-06-24T09:00:00Z"
    AppDeleteResponse:
      type: object
      description: AI App 버전 등록 삭제 결과. STOPPED Deployment 이력은 유지되며, artifact_deleted=false는 실제 artifact가 유지되었음을 뜻한다.
      required: [request_id, app_id, app_version_id, name, version, deleted, artifact_deleted, deleted_at]
      properties:
        request_id:
          type: string
          description: 요청 추적 ID.
          example: req-test-001
        app_id:
          type: string
          description: 삭제된 App 등록 식별자.
          example: app-1f4b9d8c-0a7a-4a5f-9f2c-123456789abc
        app_version_id:
          type: string
          description: 삭제된 App Version 식별자.
          example: appver-1f4b9d8c-0a7a-4a5f-9f2c-123456789abc
        name:
          type: string
          description: 삭제된 App Spec metadata.name.
          example: sample-cpu-app
        version:
          type: string
          description: 삭제된 App Spec metadata.version.
          example: 0.1.0
        deleted:
          type: boolean
          enum: [true]
          description: App Registry 등록 정보 삭제 여부.
        artifact_deleted:
          type: boolean
          enum: [false]
          description: 실제 artifact 삭제 여부. 이 API는 항상 artifact를 유지한다.
        deleted_at:
          type: string
          format: date-time
          description: App Registry 등록 삭제 시각(UTC).
          example: "2026-07-13T09:00:00Z"
    ProfileDeleteResponse:
      type: object
      additionalProperties: false
      description: |
        Runtime 또는 Target Profile 등록 삭제 결과. STOPPED Deployment, Event, Metric 이력은 유지한다.
        Target 삭제 시 존재하는 현재 Resource Inventory snapshot만 함께 제거하며 Runtime Credential은 연쇄 삭제하지 않는다.
      required: [request_id, profile_type, profile_id, name, deleted, inventory_deleted, deleted_at]
      properties:
        request_id:
          type: string
          description: 요청 추적 ID.
          example: req-test-001
        profile_type:
          type: string
          enum: [runtime, target]
          description: 삭제한 Profile 종류.
          example: target
        profile_id:
          type: string
          minLength: 1
          description: 삭제한 Runtime 또는 Target Profile ID.
          example: target-cpu-001
        name:
          type: string
          description: 삭제한 Profile 이름. 등록된 이름이 없으면 빈 문자열을 반환한다.
          example: cpu-vm-target
        deleted:
          type: boolean
          enum: [true]
          description: Profile 등록 정보 삭제 여부. 성공 응답에서는 항상 true이다.
        inventory_deleted:
          type: boolean
          description: Target의 현재 Resource Inventory snapshot이 실제로 제거되었는지 여부. Runtime 삭제에서는 항상 false이다.
          example: true
        deleted_at:
          type: string
          format: date-time
          description: Profile 등록 삭제 시각(UTC).
          example: "2026-07-13T10:00:00Z"
    AppSpec:
      type: object
      description: |
        배포할 AI App 정의.
        구현체는 schema_version=appspec.khu.ai/v1alpha1, kind=AIApp,
        artifact.type=package|git|binary|script만 허용한다.
      required: [schema_version, kind, metadata, artifact, entrypoint, runtime, resources]
      properties:
        schema_version:
          type: string
          description: App Spec 스키마 버전. 현재 구현은 appspec.khu.ai/v1alpha1만 허용한다.
          example: appspec.khu.ai/v1alpha1
        kind:
          type: string
          description: 리소스 종류. 현재 구현은 AIApp만 허용한다.
          enum: [AIApp]
          example: AIApp
        metadata:
          type: object
          description: App 이름과 버전 메타데이터.
          required: [name, version]
          properties:
            name:
              type: string
              description: 소문자/숫자/하이픈 기반 App 이름.
              example: sample-cpu-app
            version:
              type: string
              description: App 버전.
              example: 0.1.0
            description:
              type: string
              description: App 설명.
              example: CPU VM smoke app
        artifact:
          type: object
          description: |
            배포할 산출물 위치.
            script + file:// URI는 CPU/GPU SSH Runner에서 대상 VM으로 업로드된 뒤 entrypoint로 실행된다.
          required: [type, uri]
          properties:
            type:
              type: string
              enum: [package, git, binary, script]
              description: 1차년도는 package, git, binary, script만 허용한다. container는 거부된다.
              example: script
            uri:
              type: string
              description: "artifact 위치. 예: file:///opt/examples/sample-cpu-app/run.sh, git URL, package URI."
              example: file:///opt/examples/sample-cpu-app/run.sh
            checksum:
              type: string
              description: 선택적 체크섬. 현재 구현은 필드 저장만 수행한다.
              example: sha256:example
        entrypoint:
          type: object
          description: Runtime Adapter가 실행할 명령.
          required: [command]
          properties:
            command:
              type: string
              description: 실행 명령. 비어 있으면 APP_SPEC_INVALID로 거부된다.
              example: bash
            args:
              type: array
              description: 실행 인자 배열.
              items:
                type: string
              example: ["run.sh", "--port=18080"]
            working_dir:
              type: string
              description: 실행 작업 디렉터리. 비어 있으면 VM Adapter가 artifact 업로드 경로를 사용한다.
              example: /opt/aiapp/artifacts/sample-cpu-app/0.1.0
        runtime:
          type: object
          description: App이 요구하는 Runtime 종류.
          required: [type]
          properties:
            type:
              type: string
              description: App 실행 Runtime. 현재 구현은 mock, cpu, gpu, aiinfra를 지원한다.
              enum: [cpu, gpu, aiinfra, mock]
              example: cpu
            accelerator:
              type: string
              description: GPU 가속기 종류. CPU/Mock/AI-Infra 일반 흐름은 none을 사용한다.
              enum: [none, nvidia]
              example: none
        resources:
          type: object
          description: App이 요구하는 논리 자원. Matcher는 Runtime 호환성과 GPU 개수를 검증한다.
          properties:
            cpu:
              type: string
              description: CPU 요구량.
              example: "2"
            memory:
              type: string
              description: 메모리 요구량.
              example: 4Gi
            gpu:
              type: string
              description: GPU 요구 개수. gpu App은 기본 1개 이상으로 해석한다.
              example: "0"
            storage:
              type: string
              description: 저장소 요구량.
              example: 5Gi
        model_refs:
          type: array
          description: 선택적 모델 참조 목록. 현재 구현은 저장만 수행한다.
          items:
            type: object
            required: [name, uri]
            properties:
              name:
                type: string
                example: sample-model
              version:
                type: string
                example: 1.0.0
              uri:
                type: string
                example: file:///models/sample-model
              mount_path:
                type: string
                example: /models/sample-model
        network:
          type: object
          description: App 서비스 포트 정보. 현재 구현은 저장만 수행한다.
          properties:
            ports:
              type: array
              items:
                type: object
                required: [app_port]
                properties:
                  name:
                    type: string
                    example: http
                  app_port:
                    type: integer
                    minimum: 1
                    maximum: 65535
                    example: 18080
                  protocol:
                    type: string
                    enum: [TCP, UDP]
                    example: TCP
        healthcheck:
          type: object
          description: App 헬스체크 정의. 현재 구현은 저장만 수행한다.
          properties:
            type:
              type: string
              enum: [http, command]
              example: http
            path:
              type: string
              example: /health
            command:
              type: string
              example: curl -fsS http://localhost:18080/health
      example:
        schema_version: appspec.khu.ai/v1alpha1
        kind: AIApp
        metadata:
          name: sample-cpu-app
          version: 0.1.0
          description: CPU VM smoke app
        artifact:
          type: script
          uri: file:///opt/examples/sample-cpu-app/run.sh
        entrypoint:
          command: bash
          args: ["run.sh", "--port=18080"]
        runtime:
          type: cpu
          accelerator: none
        resources:
          cpu: "2"
          memory: 4Gi
          gpu: "0"
          storage: 5Gi
    RuntimeProfile:
      type: object
      description: Runtime Adapter 선택과 운영 방식을 정의한다.
      required: [runtime_profile_id, runtime_type, adapter_type, operating_mode]
      properties:
        runtime_profile_id:
          type: string
          description: Runtime Profile ID.
          example: rt-cpu-001
        name:
          type: string
          description: 사람이 읽는 Runtime Profile 이름.
          example: cpu-vm-runtime
        runtime_type:
          type: string
          description: Runtime 종류. App Spec runtime.type과 호환되어야 한다.
          enum: [mock, cpu, gpu, aiinfra]
          example: cpu
        accelerator:
          type: string
          description: 가속기 종류. GPU VM은 nvidia를 사용한다.
          enum: [none, nvidia]
          example: none
        adapter_type:
          type: string
          description: 사용할 Runtime Adapter. 서버 구현은 mock, cpu_vm, gpu_vm, etri_aiinfra를 등록한다.
          enum: [mock, cpu_vm, gpu_vm, etri_aiinfra]
          example: cpu_vm
        operating_mode:
          type: string
          description: local_mock, VM 프로세스 실행, 원격 API 연동 모드.
          enum: [local_mock, dry_run, vm_process, remote_api]
          example: vm_process
        readiness:
          type: object
          description: 외부 인터페이스 예제 호환용 readiness 점검 방식. 현재 구현은 저장만 수행한다.
          additionalProperties:
            type: string
          example:
            type: command
            command: nvidia-smi
      example:
        runtime_profile_id: rt-cpu-001
        name: cpu-vm-runtime
        runtime_type: cpu
        accelerator: none
        adapter_type: cpu_vm
        operating_mode: vm_process
    TargetProfile:
      type: object
      description: 배포 대상 VM 또는 AI-Infra Target 정보를 정의한다.
      required: [target_profile_id, csp, vm, runtime]
      properties:
        target_profile_id:
          type: string
          description: Target Profile ID.
          example: target-cpu-001
        name:
          type: string
          description: 사람이 읽는 Target 이름.
          example: cpu-vm-target
        csp:
          type: string
          description: Target 제공자. mock 외에는 구현 검증에서 vm.host가 필요하다.
          enum: [aws, azure, gcp, etri, local, mock]
          example: local
        region:
          type: string
          description: CSP 리전. 선택 필드.
          example: ap-northeast-2
        os:
          type: object
          description: Target OS 정보. 선택 필드.
          properties:
            type:
              type: string
              example: ubuntu
            version:
              type: string
              example: "22.04"
        vm:
          type: object
          description: |
            VM 또는 외부 Gateway 접근 정보.
            Secret 값은 저장하지 않고 credential_ref만 사용한다.
          properties:
            host:
              type: string
              description: VM hostname/IP 또는 AI-Infra Gateway host. mock 외에는 필수처럼 검증된다.
              example: cpu-vm.example.internal
            ssh_port:
              type: integer
              description: SSH 포트. CPU/GPU SSH Runner에서 사용한다.
              example: 22
            credential_ref:
              type: string
              minLength: 9
              maxLength: 256
              pattern: '^cred://[a-z0-9]+(?:-[a-z0-9]+)*/[a-z0-9]+(?:-[a-z0-9]+)*(?:/[a-z0-9]+(?:-[a-z0-9]+)*)*$'
              description: |
                Secret 참조. `cred://runtime/{credential_id}`는 Credential API로 현재 프로세스 메모리에 등록하며 서버 재시작 시 소멸한다.
                그 밖의 참조는 기존 환경변수 Credential resolver로 fallback한다. 허용된 `cred://namespace/id` 형식만 저장할 수 있으며,
                Target Profile에는 실제 키나 비밀번호를 저장하지 않는다.
              example: cred://local/cpu-vm-001
        runtime:
          type: object
          description: Target이 제공하는 Runtime 종류.
          properties:
            runtime_type:
              type: string
              description: Target Runtime. Adapter Router가 이 값으로 ValidateTarget/Prepare 경로를 선택한다.
              enum: [mock, cpu, gpu, aiinfra]
              example: cpu
            accelerator:
              type: string
              description: Target 가속기 종류.
              enum: [none, nvidia]
              example: none
            operating_mode:
              type: string
              description: Target 운영 모드.
              enum: [local_mock, dry_run, vm_process, remote_api]
              example: vm_process
        gpu:
          type: object
          description: GPU VM Target 정보. gpu runtime일 때 gpu.count >= 1이 필요하다.
          properties:
            vendor:
              type: string
              example: nvidia
            count:
              type: integer
              minimum: 0
              example: 1
            driver_required:
              type: boolean
              example: true
        storage:
          type: object
          description: VM artifact/model/log 경로. CPU/GPU VM Adapter는 artifact_dir과 log_dir을 요구한다.
          properties:
            artifact_dir:
              type: string
              example: /opt/aiapp/artifacts
            model_dir:
              type: string
              example: /opt/aiapp/models
            log_dir:
              type: string
              example: /var/log/aiapp
        network:
          type: object
          description: Target 네트워크 설정. 현재 구현은 저장만 수행한다.
          properties:
            service_port_range:
              type: string
              example: 18080-18100
      example:
        target_profile_id: target-cpu-001
        name: cpu-vm-target
        csp: local
        vm:
          host: cpu-vm.example.internal
          ssh_port: 22
          credential_ref: cred://local/cpu-vm-001
        runtime:
          runtime_type: cpu
          accelerator: none
          operating_mode: vm_process
        storage:
          artifact_dir: /opt/aiapp/artifacts
          model_dir: /opt/aiapp/models
          log_dir: /var/log/aiapp
    DeploymentCreateRequest:
      type: object
      description: 배포 생성 요청.
      required: [app_version_id, runtime_profile_id, target_profile_id]
      properties:
        app_id:
          type: string
          description: 외부 인터페이스 호환용 App ID. 현재 배포 생성은 app_version_id를 기준으로 처리한다.
          example: app-1f4b9d8c-0a7a-4a5f-9f2c-123456789abc
        app_version_id:
          type: string
          description: "`/apps` 등록 응답의 app_version_id."
          example: appver-1f4b9d8c-0a7a-4a5f-9f2c-123456789abc
        runtime_profile_id:
          type: string
          description: 사용할 Runtime Profile ID.
          example: rt-cpu-001
        target_profile_id:
          type: string
          description: 배포할 Target Profile ID.
          example: target-cpu-001
        requested_by:
          type: string
          description: 외부 호출 주체. 현재 구현은 선택 메타데이터로 수신한다.
          example: bespin-console
        parameters:
          type: object
          description: 배포 시 전달할 선택 파라미터. 현재 구현은 Runtime Adapter로 전달한다.
          additionalProperties: true
          example:
            port: 18080
      example:
        app_version_id: appver-1f4b9d8c-0a7a-4a5f-9f2c-123456789abc
        runtime_profile_id: rt-cpu-001
        target_profile_id: target-cpu-001
        parameters:
          port: 18080
    DeploymentResponse:
      type: object
      description: Deployment 상태 응답.
      properties:
        request_id:
          type: string
          description: 요청 추적 ID.
          example: req-test-001
        deployment_id:
          type: string
          description: Deployment ID.
          example: dep-1f4b9d8c-0a7a-4a5f-9f2c-123456789abc
        app_id:
          type: string
          description: App 단위 식별자.
          example: app-1f4b9d8c-0a7a-4a5f-9f2c-123456789abc
        app_version_id:
          type: string
          description: 배포 대상 App Version ID.
          example: appver-1f4b9d8c-0a7a-4a5f-9f2c-123456789abc
        runtime_profile_id:
          type: string
          description: 사용한 Runtime Profile ID.
          example: rt-cpu-001
        target_profile_id:
          type: string
          description: 사용한 Target Profile ID.
          example: target-cpu-001
        status:
          $ref: '#/components/schemas/DeploymentStatus'
        created_at:
          type: string
          format: date-time
          description: Deployment 생성 시각(UTC).
          example: "2026-06-24T09:00:00Z"
        updated_at:
          type: string
          format: date-time
          description: Deployment 최근 갱신 시각(UTC).
          example: "2026-06-24T09:00:01Z"
    DeploymentStatus:
      type: string
      description: 표준 Deployment 상태값.
      enum: [REQUESTED, VALIDATING, VALIDATED, SCHEDULING, DEPLOYING, RUNNING, STOPPING, STOPPED, VALIDATION_FAILED, SCHEDULING_FAILED, DEPLOYMENT_FAILED, RUNTIME_FAILED, EXTERNAL_API_FAILED, UNKNOWN]
      example: RUNNING
    DeploymentLog:
      type: object
      description: Orchestrator 이벤트 또는 Runtime Adapter 로그.
      properties:
        timestamp:
          type: string
          format: date-time
          description: 로그 시각(UTC).
          example: "2026-06-24T09:00:01Z"
        level:
          type: string
          description: 로그 레벨.
          example: INFO
        request_id:
          type: string
          description: 요청 추적 ID.
          example: req-test-001
        deployment_id:
          type: string
          description: 관련 Deployment ID.
          example: dep-1f4b9d8c-0a7a-4a5f-9f2c-123456789abc
        component:
          type: string
          description: 로그를 기록한 컴포넌트.
          example: cpu-vm-adapter
        stage:
          type: string
          description: Deployment 단계 또는 상태.
          example: DEPLOYING
        message:
          type: string
          description: 로그 메시지.
          example: cpu vm command accepted
        error_code:
          type: string
          description: 실패 시 표준 에러 코드.
          example: DEPLOYMENT_FAILED
    InferenceMetricCreateRequest:
      type: object
      description: Inference and operation metric sample request.
      properties:
        timestamp:
          type: string
          format: date-time
          description: Metric sample time. If omitted, the server stores the current time.
          example: "2026-06-25T09:00:00Z"
        latency_ms:
          type: number
          format: double
          minimum: 0
          description: End-to-end inference latency in milliseconds.
          example: 42.5
        throughput_rps:
          type: number
          format: double
          minimum: 0
          description: Throughput in requests per second.
          example: 12.25
        quality_score:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: Optional normalized quality score.
          example: 0.97
        request_count:
          type: integer
          minimum: 0
          description: Number of observed requests in the sample window.
          example: 100
        error_count:
          type: integer
          minimum: 0
          description: Number of failed requests in the sample window.
          example: 1
        metadata:
          type: object
          description: Optional metric labels such as model, scenario, or dataset.
          additionalProperties: true
          example:
            model: sample-cpu-model
            scenario: smoke
    InferenceMetricRecord:
      allOf:
        - $ref: '#/components/schemas/InferenceMetricCreateRequest'
        - type: object
          description: Stored inference and operation metric sample.
          properties:
            request_id:
              type: string
              description: 요청 추적 ID.
              example: req-test-001
            metric_id:
              type: string
              description: Metric sample ID.
              example: metric-1f4b9d8c-0a7a-4a5f-9f2c-123456789abc
            deployment_id:
              type: string
              description: Deployment ID associated with the metric.
              example: dep-1f4b9d8c-0a7a-4a5f-9f2c-123456789abc
            timestamp:
              type: string
              format: date-time
              description: Stored metric sample time.
              example: "2026-06-25T09:00:00Z"
    InferenceInvokeRequest:
      type: object
      description: Request body for proxying an inference call to a running deployment.
      properties:
        method:
          type: string
          enum: [GET, POST]
          default: POST
          example: POST
        path:
          type: string
          description: Relative path on the deployed app. Defaults to `/generate`.
          example: /generate
        port:
          type: integer
          minimum: 1
          maximum: 65535
          description: Optional app port override. Defaults to the first App Spec network port.
          example: 18081
        timeout_seconds:
          type: integer
          minimum: 1
          maximum: 300
          default: 30
          example: 30
        headers:
          type: object
          additionalProperties:
            type: string
          example:
            x-demo: ai-app
        body:
          type: object
          additionalProperties: true
          example:
            prompt: "Explain AI app deployment in one sentence."
            max_new_tokens: 64
    InferenceInvokeResponse:
      type: object
      description: Wrapper response returned by the inference proxy.
      properties:
        request_id:
          type: string
          example: req-test-001
        deployment_id:
          type: string
          example: dep-1f4b9d8c-0a7a-4a5f-9f2c-123456789abc
        app_id:
          type: string
          example: app-1f4b9d8c-0a7a-4a5f-9f2c-123456789abc
        app_version_id:
          type: string
          example: appver-1f4b9d8c-0a7a-4a5f-9f2c-123456789abc
        runtime_profile_id:
          type: string
          example: rt-gpu-001
        target_profile_id:
          type: string
          example: target-nhn-gpu-001
        method:
          type: string
          example: POST
        path:
          type: string
          example: /generate
        port:
          type: integer
          example: 18081
        status_code:
          type: integer
          example: 200
        body:
          type: object
          additionalProperties: true
          example:
            status: ok
            output: "AI application inference completed."
        raw_body:
          type: string
          description: Non-JSON response body, only populated when the proxied app does not return JSON.
        duration_ms:
          type: integer
          example: 2700
        invoked_at:
          type: string
          format: date-time
          example: "2026-07-01T03:20:00Z"
    ResourceCheckResponse:
      type: object
      description: Target readiness 점검 결과.
      properties:
        request_id:
          type: string
          description: 요청 추적 ID.
          example: req-test-001
        runtime_profile_id:
          type: string
          description: 요청에 포함된 Runtime Profile ID. 선택 입력이 없으면 생략된다.
          example: rt-gpu-001
        target_profile_id:
          type: string
          description: 점검한 Target Profile ID.
          example: target-cpu-001
        status:
          type: string
          description: readiness 결과.
          enum: [available, degraded, unavailable]
          example: available
        checks:
          type: object
          description: target/runtime 점검 상세. 실패 시 에러 메시지를 포함한다.
          additionalProperties:
            type: string
          example:
            target: ok
            runtime: ok
        details:
          type: object
          description: Runtime/GPU 등 추가 readiness 상세.
          additionalProperties: true
        checked_at:
          type: string
          format: date-time
          description: 점검 시각(UTC).
    ResourceInventory:
      type: object
      description: 최근 Target 자원 점검 스냅샷.
      properties:
        target_profile_id:
          type: string
          example: target-gpu-001
        cpu_available:
          type: boolean
          example: true
        memory_available:
          type: boolean
          example: true
        gpu_available:
          type: boolean
          example: true
        storage_available:
          type: boolean
          example: true
        runtime_health:
          type: string
          example: ok
        last_checked_at:
          type: string
          format: date-time
          example: "2026-06-24T09:00:00Z"
    MonitoringSummaryResponse:
      type: object
      description: Deployment, Runtime health, 알람을 합친 모니터링 요약.
      properties:
        request_id:
          type: string
          description: 요청 추적 ID.
          example: req-test-001
        generated_at:
          type: string
          format: date-time
          description: 요약 생성 시각(UTC).
          example: "2026-06-25T09:00:00Z"
        status:
          type: string
          description: 전체 모니터링 상태. 실패 Deployment나 알람이 있으면 degraded.
          enum: [ok, degraded]
          example: degraded
        deployments:
          $ref: '#/components/schemas/DeploymentMonitorSummary'
        runtime_health:
          type: array
          items:
            $ref: '#/components/schemas/RuntimeHealthSnapshot'
        alarms:
          type: array
          items:
            $ref: '#/components/schemas/DeploymentAlarmSummary'
    DeploymentMonitorSummary:
      type: object
      description: Deployment 상태 집계.
      properties:
        total:
          type: integer
          example: 2
        active:
          type: integer
          example: 1
        failed:
          type: integer
          example: 1
        stopped:
          type: integer
          example: 0
        by_status:
          type: object
          description: 상태별 Deployment 개수.
          additionalProperties:
            type: integer
          example:
            RUNNING: 1
            VALIDATION_FAILED: 1
    RuntimeHealthSnapshot:
      type: object
      description: Target별 Runtime health snapshot.
      properties:
        target_profile_id:
          type: string
          example: target-cpu-001
        status:
          type: string
          enum: [available, degraded, unavailable]
          example: available
        runtime_health:
          type: string
          example: ok
        cpu_available:
          type: boolean
          example: true
        memory_available:
          type: boolean
          example: true
        gpu_available:
          type: boolean
          example: false
        storage_available:
          type: boolean
          example: true
        last_checked_at:
          type: string
          format: date-time
          example: "2026-06-25T09:00:00Z"
    DeploymentAlarmSummary:
      type: object
      description: Deployment 실패 이벤트 기반 알람 요약.
      properties:
        severity:
          type: string
          enum: [error, critical]
          example: error
        error_code:
          type: string
          example: APP_SPEC_INVALID
        count:
          type: integer
          example: 1
        latest_deployment_id:
          type: string
          example: dep-1f4b9d8c-0a7a-4a5f-9f2c-123456789abc
        latest_stage:
          type: string
          example: VALIDATION_FAILED
        latest_message:
          type: string
          example: app version not found
        latest_at:
          type: string
          format: date-time
          example: "2026-06-25T09:00:00Z"
        retryable:
          type: boolean
          example: false
    ErrorResponse:
      type: object
      description: 표준 에러 응답. request_id는 요청 추적에 사용한다.
      properties:
        request_id:
          type: string
          description: 요청 추적 ID.
          example: req-test-001
        error:
          $ref: '#/components/schemas/ErrorObject'
    ErrorObject:
      type: object
      description: 표준 에러 본문.
      properties:
        code:
          type: string
          description: 표준 에러 코드. 일부 조회 실패는 구현상 NOT_FOUND를 반환한다.
          enum: [APP_SPEC_INVALID, APP_ARTIFACT_NOT_FOUND, ENTRYPOINT_INVALID, RUNTIME_PROFILE_INVALID, TARGET_PROFILE_INVALID, RESOURCE_INSUFFICIENT, GPU_RUNTIME_NOT_FOUND, NVIDIA_DRIVER_NOT_FOUND, CSP_VM_UNREACHABLE, STORAGE_PATH_UNAVAILABLE, AI_INFRA_API_TIMEOUT, AI_INFRA_API_FAILED, GATEWAY_AUTH_FAILED, BESPIN_API_FAILED, DEPLOYMENT_FAILED, RUNTIME_FAILED, NOT_FOUND, UNKNOWN]
          example: APP_SPEC_INVALID
        message:
          type: string
          description: 사람이 읽을 수 있는 실패 사유.
          example: artifact.type must be one of package, git, binary, script
        details:
          type: object
          description: 에러별 추가 정보.
          additionalProperties: true
          example:
            provider: etri
        retryable:
          type: boolean
          description: 재시도 가능 여부.
          example: false
