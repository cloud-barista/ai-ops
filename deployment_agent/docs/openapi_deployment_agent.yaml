    ScalingDecision:
      type: object
      required:
      - action
      - reason
      - current_replicas
      - desired_replicas
      - created_at
      properties:
        decision_id:
          type: string
          description: 'Local decision identity assigned after Guard approval. This is not an execution action
            ID and is absent from rejected proposals.

            '
        action:
          type: string
          description: 'Canonical scaling recommendation. KEEP preserves the latest guarded plan''s desired
            replica count. Legacy NO_ACTION is accepted only as an Operation Agent proposal/result value and
            is normalized to KEEP before Guard validation; new responses use KEEP.

            '
          enum:
          - KEEP
          - SCALE_OUT
          - SCALE_IN
        reason:
          type: string
          minLength: 1
          maxLength: 8000
        current_replicas:
          type: integer
          minimum: 1
          description: Latest guarded plan's desired count; an applied replica count is not independently
            observed here.
        desired_replicas:
          type: integer
          minimum: 1
        evidence:
          type: array
          items:
            type: string
        created_at:
          type: string
          format: date-time
    OperationOptimizationResult:
      type: object
      required:
      - run_id
      - status
      description: 'Evidence returned by the Operation Optimization Agent after deployment status and optimization
        Feedback are joined. run_id is a deterministic, auditable operation execution identifier derived from
        the Flow and Feedback event. A completed result carries source, request_guard, result_guard, scaling_guard,
        and decision; all Guards remain outside the Agent. Terminal failed or rejected evidence may omit unavailable
        identity, Guard, latency, and decision fields and contains only terminal-safe evidence. Only a completed
        result with approved Guards can populate scaling_decision.

        '
      properties:
        run_id:
          type: string
        agent_name:
          type: string
          description: Present when the selected Agent identity is known.
          example: OperationOptimizationAgent
        source:
          type: string
          enum:
          - configuration
          - runtime
          description: Present for a resolved Agent.
        status:
          type: string
          enum:
          - completed
          - rejected
          - failed
        latency_ms:
          type: integer
          format: int64
          description: Present when execution latency is available.
        request_guard:
          $ref: '#/components/schemas/AgentControlGuardResult'
        result_guard:
          $ref: '#/components/schemas/AgentControlGuardResult'
        scaling_guard:
          $ref: '#/components/schemas/AgentControlGuardResult'
        decision:
          $ref: '#/components/schemas/ScalingDecision'
        message:
          type: string
          description: Terminal-safe execution summary.
