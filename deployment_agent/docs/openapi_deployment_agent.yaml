openapi: 3.0.3
info:
  title: AI-MCMP Deployment Agent API
  version: 1.0.0
  description: >-
    Focused deployment-agent boundary. It accepts the ApplicationProfile from
    llmop and ResourceRecommendation from resource-ops, validates correlation,
    rechecks ranked resource capacity and availability, runs the bounded Agent
    and Go Guards, and returns a deployment plan or a REJECT/RETRY decision.
    Legacy all-in-one APIs are not exposed in this mode.
paths:
  /healthz:
    get:
      operationId: GetDeploymentAgentHealth
      responses:
        '200':
          description: Focused deployment-agent readiness
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  service:
                    type: string
                    example: deployment-agent
                  role:
                    type: string
                    example: validated_deployment_decision_and_planning
                  input:
                    type: string
                    example: application_profile_plus_resource_recommendation
                  legacy_api_enabled:
                    type: boolean
                    example: false
      summary: Check Deployment Agent health and role
      tags:
      - Service
  /api/v1/deployment-plans:
    post:
      operationId: CreateDeploymentPlanFromResults
      summary: Generate a guarded deployment plan from upstream results
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeploymentPlanningRequest'
      responses:
        '201':
          description: DEPLOY or UPDATE decision and deployment plan generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentControlFlow'
        '200':
          description: Valid REJECT/RETRY decision or an idempotent replay of an unchanged focused request
          headers:
            Idempotent-Replayed:
              description: Set to true only when the same correlation_id and full decoded request were
                already accepted.
              schema:
                type: string
                enum:
                - 'true'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentControlFlow'
        '400':
          description: Malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FocusedErrorResponse'
        '422':
          description: Correlation or domain validation failed. A changed request under an existing correlation_id
            is rejected; use a new correlation_id. Duplicate resource IDs, nonsequential ranks, and contradictory
            optional accelerator requirements are also rejected.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FocusedErrorResponse'
      description: Accept one JSON object up to 4 MiB. A changed request under an existing correlation_id
        is rejected; use a new correlation_id.
      tags:
      - Deployment Planning
  /api/v1/agent-control/deployment-status:
    post:
      summary: Receive a deployment status message
      description: Attaches a deployment.status.changed Common JSON v1.0 message to its correlation flow
        and summarizes the current outcome.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeploymentStatusEnvelope'
      responses:
        '202':
          description: Deployment result attached to the correlated flow
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentControlFlow'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: Invalid status or reuse of a message_id with changed content
      operationId: ReceiveDeploymentStatus
      tags:
      - Deployment Flows
  /api/v1/agent-control/optimization-feedback:
    post:
      summary: Receive optimization feedback
      description: 'Attaches an optimization.feedback.created Common JSON v1.0 message, joins it with
        deployment.status.changed, and records the selected Operation Optimization Agent evidence. A resulting
        scaling decision is a guarded recommendation only; geon does not execute VM, Kubernetes, AppDeploy,
        or other infrastructure control from this endpoint.

        '
      parameters:
      - name: operation_agent
        in: query
        required: false
        description: 'Optional Registry-authorized Operation Optimization Agent name. When omitted, the
          Registry default is used.

          '
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OptimizationFeedbackEnvelope'
      responses:
        '202':
          description: Feedback validated and summarized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentControlFlow'
        '400':
          $ref: '#/components/responses/BadRequest'
      operationId: ReceiveOptimizationFeedback
      tags:
      - Deployment Flows
  /api/v1/agent-control/flows:
    get:
      summary: List Agent Control input flows
      responses:
        '200':
          description: Correlated deployment flows
          content:
            application/json:
              schema:
                type: object
                required:
                - count
                - flows
                properties:
                  count:
                    type: integer
                    minimum: 0
                  flows:
                    type: array
                    items:
                      $ref: '#/components/schemas/AgentControlFlow'
      operationId: ListDeploymentFlows
      tags:
      - Deployment Flows
    delete:
      summary: Delete all Agent Control experiment flows
      description: Clears the in-memory Agent Control experiment records.
      responses:
        '200':
          description: All experiment flows deleted
          content:
            application/json:
              schema:
                type: object
                required:
                - deleted
                - flows
                properties:
                  deleted:
                    type: integer
                    minimum: 0
                  flows:
                    type: array
                    items:
                      $ref: '#/components/schemas/AgentControlFlow'
      operationId: DeleteApiVAgentControlFlows
      tags:
      - Deployment Flows
  /api/v1/agent-control/flows/{correlation_id}:
    get:
      summary: Get one Agent Control input flow
      parameters:
      - name: correlation_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Deployment flow
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentControlFlow'
        '404':
          description: Flow not found
      operationId: GetDeploymentFlow
      tags:
      - Deployment Flows
    delete:
      summary: Delete one Agent Control experiment flow
      description: Deletes one in-memory experiment record by correlation_id.
      parameters:
      - name: correlation_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Experiment flow deleted
          content:
            application/json:
              schema:
                type: object
                required:
                - deleted
                - correlation_id
                properties:
                  deleted:
                    type: integer
                    enum:
                    - 1
                  correlation_id:
                    type: string
        '404':
          description: Flow not found
      operationId: DeleteApiVAgentControlFlowsCorrelationId
      tags:
      - Deployment Flows
  /api/v1/agent-control/flows/{correlation_id}/reasoning-comparisons:
    post:
      summary: Compare simple and validated Qwen reasoning
      description: Returns the deterministic rule result, raw Qwen proposal, and the final proposal after
        Go Guard validation.
      parameters:
      - name: correlation_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentControlReasoningComparisonRequest'
      responses:
        '200':
          description: Rule-based, simple-inference, and validated-inference comparison
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReasoningComparison'
        '400':
          $ref: '#/components/responses/BadRequest'
      operationId: CompareDeploymentReasoning
      tags:
      - Deployment Flows
  /geon/readyz:
    get:
      operationId: GetGeonReadiness
      summary: Check whether geon runtime dependencies are ready
      responses:
        '200':
          description: Ready to accept geon automation requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
        '503':
          description: Configuration or a required local dependency is not ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
      tags:
      - Service
  /openapi.yaml:
    get:
      summary: Download this contract
      responses:
        '200':
          description: OpenAPI YAML
      operationId: GetOpenapiYaml
      tags:
      - Service
  /api/v1/agents:
    get:
      summary: List configured and runtime agents
      responses:
        '200':
          description: Agent list
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
      operationId: GetApiVAgents
      tags:
      - Agent Registry
    post:
      summary: Register an external agent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExternalAgentRegistrationRequest'
      responses:
        '201':
          description: Registered agent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentProfile'
        '400':
          $ref: '#/components/responses/BadRequest'
      operationId: PostApiVAgents
      tags:
      - Agent Registry
  /api/v1/agents/{name}:
    get:
      summary: Get a registered agent
      parameters:
      - $ref: '#/components/parameters/AgentName'
      responses:
        '200':
          description: Agent profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentProfile'
        '404':
          description: Agent not found
      operationId: GetApiVAgentsName
      tags:
      - Agent Registry
    delete:
      summary: Delete a runtime Agent
      description: Deletes only an Agent registered in the current geon process. Configuration-backed
        Agents are protected.
      security:
      - AutonomyAdminToken: []
      parameters:
      - $ref: '#/components/parameters/AgentName'
      responses:
        '200':
          description: Runtime Agent deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted:
                    type: boolean
                    example: true
                  name:
                    type: string
                  source:
                    type: string
                    enum:
                    - runtime
        '401':
          description: Invalid or missing admin token for an external request
        '403':
          description: Configuration Agent is protected or external mutations are disabled
        '404':
          description: Runtime Agent not found
      operationId: DeleteApiVAgentsName
      tags:
      - Agent Registry
  /api/v1/agent-control/external-flows:
    post:
      summary: Validate and join an external input pair atomically
      description: Matching correlation_id, trace_id and profile_id are required. Identical replays return
        the existing Flow; conflicting reuse is rejected.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - application_context
              - resource_recommendation
              properties:
                application_context:
                  $ref: '#/components/schemas/ApplicationContextEnvelope'
                resource_recommendation:
                  $ref: '#/components/schemas/ResourceRecommendationEnvelope'
                decision_agent:
                  type: string
      responses:
        '202':
          description: Joined Flow and guarded Agent decision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentControlFlow'
        '400':
          description: Invalid or conflicting external pair
      operationId: PostApiVAgentControlExternalFlows
      tags:
      - Deployment Flows
  /api/v1/agent-control/integration:
    get:
      summary: Inspect configured AppDeployer integration
      responses:
        '200':
          description: Availability without exposing destination credentials
          content:
            application/json:
              schema:
                type: object
                properties:
                  configured:
                    type: boolean
                  submit_enabled:
                    type: boolean
                  external_input_path:
                    type: string
      operationId: GetApiVAgentControlIntegration
      tags:
      - AppDeploy Integration
  /api/v1/agent-control/flows/{correlation_id}/appdeploy/{action}:
    post:
      summary: Prepare or explicitly submit approved initial Revision 1
      description: Requires an App Registry identity match. Only one node and one replica are supported.
        Registered AppSpec settings and AppDeployer placement are used; inference settings and GPU VRAM
        minima are not enforced. Local KHU request IDs are not AppDeployer action acknowledgements. Submission
        attempts are journaled and uncertain results are not automatically retried.
      parameters:
      - name: correlation_id
        in: path
        required: true
        schema:
          type: string
      - name: action
        in: path
        required: true
        schema:
          type: string
          enum:
          - prepare
          - submit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - app_version_id
              properties:
                app_version_id:
                  type: string
                accept_projection_limits:
                  type: boolean
                  description: Must be true for submission
      responses:
        '200':
          description: Prepared request or durable delivery receipt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlowDelivery'
        '400':
          description: Invalid request
        '409':
          description: Submission disabled, invalid binding, unapproved Flow or unconfirmed upstream response
      operationId: PostApiVAgentControlFlowsCorrelationIdAppdeployAction
      tags:
      - AppDeploy Integration
  /api/v1/agent-control/flows/{correlation_id}/appdeploy:
    get:
      summary: Query AppDeployer-reported deployment state and raw metrics for a recorded delivery
      description: Source-declared status and local fetch time are journaled before Flow attachment. RUNNING
        does not prove ready replicas or user SLO success.
      parameters:
      - name: correlation_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Receipt with status and available metrics; no synthetic optimization feedback
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlowDelivery'
        '409':
          description: Missing receipt, changed destination or upstream query failure
      operationId: GetApiVAgentControlFlowsCorrelationIdAppdeploy
      tags:
      - AppDeploy Integration
components:
  parameters:
    AgentName:
      name: name
      in: path
      required: true
      schema:
        type: string
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  securitySchemes:
    AutonomyAdminToken:
      type: http
      scheme: bearer
      bearerFormat: opaque admin token
  schemas:
    DeploymentPlanningRequest:
      type: object
      required:
        - correlation_id
        - trace_id
        - application_profile
        - resource_recommendation
      properties:
        schema_version: {type: string, enum: ["1.0"], default: "1.0"}
        correlation_id:
          type: string
          minLength: 1
          description: >-
            Must equal resource_recommendation.request_id. The full decoded
            request is immutable for this ID; use a new ID if any field changes.
        trace_id: {type: string, minLength: 1}
        decision_agent: {type: string}
        deployment_context:
          type: object
          properties:
            deployment_ref: {type: string}
            current_spec_digest: {type: string}
            current_replicas: {type: integer}
            spec_drift: {type: boolean}
            cooldown_active: {type: boolean}
          additionalProperties: false
        application_profile:
          $ref: "#/components/schemas/ApplicationProfile"
        resource_recommendation:
          $ref: "#/components/schemas/ResourceOpsRecommendation"
      additionalProperties: false
    ApplicationProfile:
      type: object
      required: [profile_id, app_id, app_version, requirements]
      properties:
        profile_id: {type: string, minLength: 1}
        app_id: {type: string, minLength: 1}
        app_version: {type: string, minLength: 1}
        artifact:
          type: object
          properties:
            type: {type: string}
            uri: {type: string}
            entrypoint: {type: array, items: {type: string}}
        workload:
          type: object
          properties:
            task_type: {type: string}
            request_pattern: {type: string}
            expected_rps: {type: number, minimum: 0}
        requirements:
          type: object
          required: [compute, accelerator, deployment]
          properties:
            compute:
              type: object
              required: [cpu_cores_min, memory_mib_min, storage_gib_min]
              properties:
                cpu_cores_min: {type: integer, minimum: 1}
                memory_mib_min: {type: integer, minimum: 1}
                storage_gib_min: {type: integer, minimum: 0}
            accelerator:
              type: object
              description: >-
                When required is false, type must be empty or omitted and
                count_min and memory_mib_min_per_device must be zero or omitted.
              required: [required]
              properties:
                required: {type: boolean}
                type: {type: string}
                count_min: {type: integer, minimum: 0}
                memory_mib_min_per_device: {type: integer, minimum: 0}
            deployment:
              type: object
              required: [replicas_min, replicas_max, isolation]
              properties:
                replicas_min: {type: integer, minimum: 1}
                replicas_max: {type: integer, minimum: 1}
                isolation: {type: string}
            slo: {type: object}
            cost: {type: object}
        analysis: {type: object}
    ResourceOpsRecommendation:
      type: object
      description: >-
        Resource Ops owns ranking. Deployment Agent checks each ranked node's
        total and available CPU, memory, required storage, and required GPU
        count, type, health, and memory before accepting it as feasible.
        Insufficient or missing capacity remains rejection evidence in the
        Flow; selection uses the first feasible nodes in the original order.
        Duplicate resource IDs and nonsequential ranks are invalid input.
      required:
        - schema_version
        - request_id
        - profile_id
        - source
        - observed_at
        - query
        - recommendations
        - excluded_resources
        - summary
        - warnings
      properties:
        schema_version: {type: string, enum: ["1.0"]}
        request_id:
          type: string
          minLength: 1
          description: Must equal the outer correlation_id.
        profile_id:
          type: string
          minLength: 1
          description: Must equal application_profile.profile_id.
        source: {type: string, minLength: 1}
        observed_at: {type: string, format: date-time}
        query: {type: object}
        recommendations:
          type: array
          items:
            $ref: "#/components/schemas/RankedResource"
        excluded_resources: {type: array, items: {type: object}}
        summary:
          type: object
          required: [discovered, feasible, excluded, returned]
          properties:
            discovered: {type: integer, minimum: 0}
            feasible: {type: integer, minimum: 0}
            excluded: {type: integer, minimum: 0}
            returned: {type: integer, minimum: 0}
        warnings: {type: array, items: {type: string}}
      additionalProperties: false
    RankedResource:
      type: object
      required: [rank, score, resource, score_breakdown, reasons]
      properties:
        rank: {type: integer, minimum: 1}
        score: {type: number, minimum: 0, maximum: 100}
        resource:
          type: object
          required: [resource_id, healthy, observed_at, cpu, memory, storage, accelerators, warnings]
          properties:
            resource_id: {type: string, minLength: 1}
            hostname: {type: string}
            address: {type: string}
            provider: {type: string}
            region: {type: string}
            resource_type: {type: string}
            architecture: {type: string}
            operating_system: {type: string}
            healthy: {type: boolean}
            observed_at: {type: string, format: date-time}
            cpu:
              type: object
              required: [logical_cores]
              properties:
                logical_cores: {type: integer, minimum: 0}
                available_cores:
                  type: number
                  minimum: 0
                  description: Omission or insufficient availability makes the resource infeasible.
                utilization_percent: {type: number, minimum: 0, maximum: 100}
              additionalProperties: false
            memory:
              type: object
              required: [total_mib]
              properties:
                total_mib: {type: number, minimum: 0}
                available_mib:
                  type: number
                  minimum: 0
                  description: Omission or insufficient availability makes the resource infeasible.
              additionalProperties: false
            storage:
              type: object
              required: [total_gib]
              properties:
                total_gib: {type: number, minimum: 0}
                available_gib:
                  type: number
                  minimum: 0
                  description: Required when storage_gib_min is positive.
              additionalProperties: false
            accelerators:
              type: array
              items:
                type: object
                required: [device_id, type, memory_total_mib, healthy]
                properties:
                  device_id: {type: string, minLength: 1}
                  index: {type: string}
                  type: {type: string, minLength: 1}
                  model: {type: string}
                  memory_total_mib: {type: number, minimum: 0}
                  memory_available_mib:
                    type: number
                    minimum: 0
                    description: Required for a matching device to count as available.
                  utilization_percent: {type: number, minimum: 0, maximum: 100}
                  healthy: {type: boolean}
                additionalProperties: false
            labels: {type: object, additionalProperties: {type: string}}
            warnings: {type: array, items: {type: string}}
        score_breakdown:
          type: object
          required: [health, total]
          properties:
            cpu: {type: number, minimum: 0, maximum: 100}
            memory: {type: number, minimum: 0, maximum: 100}
            storage: {type: number, minimum: 0, maximum: 100}
            accelerator: {type: number, minimum: 0, maximum: 100}
            health: {type: number, minimum: 0, maximum: 100}
            total: {type: number, minimum: 0, maximum: 100}
        reasons: {type: array, items: {type: object}}
    FocusedErrorResponse:
      type: object
      required:
      - schema_version
      - error
      properties:
        schema_version:
          type: string
          enum:
          - '1.0'
        error:
          type: object
          required:
          - code
          - message
          properties:
            code:
              type: string
            message:
              type: string
    FlowDelivery:
      type: object
      description: Initial Revision 1 submission receipt. Status observations do not prove service readiness
        or applied replica count; optimized revisions are not submitted by this endpoint.
      properties:
        correlation_id:
          type: string
        decision_id:
          type: string
        revision:
          type: integer
          enum:
          - 1
        request_id:
          type: string
          description: Immutable local KHU approved initial DeploymentRequest ID; AppDeployer does not echo
            it as an execution action ID.
        request_message_id:
          type: string
          description: Immutable local KHU approved initial Common JSON message ID; AppDeployer does not echo
            it.
        request_occurred_at:
          type: string
          format: date-time
        status:
          type: string
          enum:
          - PREPARED
          - SUBMISSION_UNKNOWN
          - SUBMITTED
        reserved_at:
          type: string
          format: date-time
          description: Local time before the outbound POST; an unknown attempt may never have reached AppDeployer.
        receipt_received_at:
          type: string
          format: date-time
          description: Local time when a matching AppDeployer response was confirmed.
        manifest_sha256:
          type: string
        destination_sha256:
          type: string
        request:
          type: object
          additionalProperties: true
        deployment:
          type: object
          additionalProperties: true
        status_observations:
          type: array
          description: Source-declared deployment states fetched by KHU. A source time earlier than the local
            reservation is rejected for reconciliation, not silently treated as local fallback.
          items:
            $ref: '#/components/schemas/FlowDeliveryStatusObservation'
        metrics:
          type: object
          additionalProperties: true
        limitations:
          type: array
          items:
            type: string
        flow:
          $ref: '#/components/schemas/AgentControlFlow'
        updated_at:
          type: string
          format: date-time
    AgentControlFlow:
      type: object
      required:
      - correlation_id
      - trace_id
      - state
      - updated_at
      properties:
        correlation_id:
          type: string
        trace_id:
          type: string
        automation_run_id:
          type: string
        requested_decision_agent:
          type: string
        requested_operation_agent:
          type: string
          description: Operation Optimization Agent requested for the joined deployment status and Feedback.
        profile_id:
          type: string
        state:
          type: string
          enum:
          - WAITING_FOR_APPLICATION_CONTEXT
          - WAITING_FOR_RESOURCE_RECOMMENDATION
          - READY
          - AGENT_AUTHORIZATION_REJECTED
          - AGENT_EXECUTION_FAILED
          - AGENT_RESULT_REJECTED
          - DEPLOY_APPROVED
          - REJECTED
          - RETRY_REQUIRED
        application_context:
          $ref: '#/components/schemas/ApplicationContextEnvelope'
        resource_recommendation:
          $ref: '#/components/schemas/ResourceRecommendationEnvelope'
        agent_authorization:
          $ref: '#/components/schemas/AgentAuthorization'
        agent_execution:
          $ref: '#/components/schemas/DecisionAgentResult'
        decision:
          $ref: '#/components/schemas/AutomationDecision'
        deployment_plan:
          $ref: '#/components/schemas/AgentControlDeploymentPlan'
        guard:
          $ref: '#/components/schemas/AgentControlGuardResult'
        deployment_request:
          $ref: '#/components/schemas/DeploymentCreateRequestEnvelope'
        manifest_revisions:
          type: array
          description: Ordered guarded manifest revisions in this Flow.
          items:
            $ref: '#/components/schemas/AgentControlManifestRevision'
        deployment_status:
          $ref: '#/components/schemas/DeploymentStatusEnvelope'
        optimization_feedback:
          $ref: '#/components/schemas/OptimizationFeedbackEnvelope'
        feedback_summary:
          $ref: '#/components/schemas/FeedbackSummary'
        operation_agent_execution:
          $ref: '#/components/schemas/OperationOptimizationResult'
        scaling_decision:
          $ref: '#/components/schemas/ScalingDecision'
        scaling_decision_history:
          type: array
          maxItems: 128
          description: 'Newest Guard-approved KEEP, SCALE_OUT, and SCALE_IN recommendations retained in this
            in-memory Flow. Older entries are evicted and counted in scaling_decision_history_dropped. This
            is not a durable action or research outcome journal; deleting the Flow or restarting loses it.

            '
          items:
            $ref: '#/components/schemas/ScalingDecisionRecord'
        scaling_decision_history_dropped:
          type: integer
          minimum: 0
          description: Number of older approved decision records evicted from this Flow.
        reasoning_comparison:
          $ref: '#/components/schemas/ReasoningComparison'
        updated_at:
          type: string
          format: date-time
    ReasoningComparison:
      type: object
      required:
      - correlation_id
      - candidate_id
      - rule_based
      - simple_inference
      - validated_inference
      - agreement
      - created_at
      properties:
        correlation_id:
          type: string
        candidate_id:
          type: string
        rule_based:
          $ref: '#/components/schemas/ReasoningTrial'
        simple_inference:
          $ref: '#/components/schemas/ReasoningTrial'
        validated_inference:
          $ref: '#/components/schemas/ReasoningTrial'
        agreement:
          type: object
          required:
          - action_match
          - candidate_match
          properties:
            action_match:
              type: boolean
            candidate_match:
              type: boolean
        created_at:
          type: string
          format: date-time
    ReasoningTrial:
      type: object
      required:
      - mode
      - execution_status
      - latency_ms
      - guard_status
      properties:
        mode:
          type: string
          enum:
          - rule_based
          - simple_inference
          - validated_inference
        execution_status:
          type: string
          enum:
          - executed
          - skipped
          - provider_unavailable
          - rejected
        candidate_id:
          type: string
        provider:
          type: string
        actual_model:
          type: string
        latency_ms:
          type: integer
          format: int64
          minimum: 0
        action:
          type: string
          enum:
          - DEPLOY
          - REJECT
          - RETRY
        proposed_action:
          type: string
          enum:
          - DEPLOY
          - REJECT
          - RETRY
        selected_candidate_id:
          type: string
        reason:
          type: string
        confidence:
          type: number
          minimum: 0
          maximum: 1
        guard_status:
          type: string
          enum:
          - APPROVED
          - REJECTED
          - RETRY_REQUIRED
          - NOT_APPLIED
        guard_reason:
          type: string
        error:
          type: string
    ScalingDecisionRecord:
      type: object
      description: 'Immutable-in-Flow snapshot of one approved local scaling recommendation. Upstream occurred_at
        and updated_at values are sender-declared; the accepted_at and committed_at values are KHU service
        local timestamps. No field confirms command acceptance, replica readiness, or user SLO effect.

        '
      required:
      - decision_id
      - operation_run_id
      - decision
      - profile_id
      - app_id
      - app_version
      - application_context_message_id
      - application_context
      - application_context_accepted_at
      - resource_recommendation_message_id
      - resource_recommendation
      - resource_recommendation_accepted_at
      - input_manifest_revision
      - input_manifest_request_id
      - input_manifest_request_message_id
      - deployment_status
      - deployment_status_accepted_at
      - optimization_feedback
      - optimization_feedback_accepted_at
      - slo
      - replicas_min
      - replicas_max
      - committed_at
      properties:
        decision_id:
          type: string
          description: Stable local ID derived from correlation_id and feedback message_id; not an action
            ID.
        operation_run_id:
          type: string
        decision:
          $ref: '#/components/schemas/ScalingDecision'
        profile_id:
          type: string
        app_id:
          type: string
        app_version:
          type: string
        input_origin:
          type: string
        application_context_message_id:
          type: string
        application_context:
          $ref: '#/components/schemas/ApplicationContextEnvelope'
        application_context_accepted_at:
          type: string
          format: date-time
          description: Local time this application context was accepted by KHU.
        resource_recommendation_message_id:
          type: string
        resource_recommendation:
          $ref: '#/components/schemas/ResourceRecommendationEnvelope'
        resource_recommendation_accepted_at:
          type: string
          format: date-time
          description: Local time this recommendation was accepted by KHU.
        input_manifest_revision:
          type: integer
          minimum: 1
        input_manifest_request_id:
          type: string
        input_manifest_request_message_id:
          type: string
          description: Common JSON message ID named by deployment status causation_id.
        deployment_status:
          $ref: '#/components/schemas/DeploymentStatusEnvelope'
        deployment_status_accepted_at:
          type: string
          format: date-time
          description: Local time this status message was accepted by KHU.
        optimization_feedback:
          $ref: '#/components/schemas/OptimizationFeedbackEnvelope'
        optimization_feedback_accepted_at:
          type: string
          format: date-time
          description: Local time this feedback message was accepted by KHU.
        slo:
          type: object
          properties:
            latency_p95_ms_max:
              type: number
            throughput_rps_min:
              type: number
        replicas_min:
          type: integer
          minimum: 1
        replicas_max:
          type: integer
          minimum: 1
        committed_at:
          type: string
          format: date-time
          description: Local time KHU committed the Guard-approved decision.
        output_manifest_revision:
          type: integer
          minimum: 1
          description: Present for SCALE_OUT or SCALE_IN when an optimized revision was generated.
        output_manifest_request_id:
          type: string
          description: Local request ID of that optimized revision; not an execution acknowledgement.
        output_manifest_request_message_id:
          type: string
          description: Common JSON message ID of that optimized revision; not an execution acknowledgement.
    OptimizationFeedbackEnvelope:
      allOf:
      - $ref: '#/components/schemas/CommonMessageEnvelope'
