          type: string
          enum:
          - configuration
          - runtime
        status:
          type: string
          enum:
          - completed
          - rejected
          - failed
        request_guard:
          $ref: '#/components/schemas/AgentControlGuardResult'
        result_guard:
          $ref: '#/components/schemas/AgentControlGuardResult'
        decision:
          $ref: '#/components/schemas/AutomationDecision'
        latency_ms:
          type: integer
          format: int64
          minimum: 0
        message:
          type: string
    AgentAuthorization:
      type: object
      required:
      - agent_name
      - capability
      - action
      - authorized
      - reason
      properties:
        agent_name:
          type: string
          description: Selected configuration or Runtime Agent name
        capability:
          type: string
          enum:
          - ai_application_automation
        action:
          type: string
          enum:
          - generate_deployment_decision
        authorized:
          type: boolean
        reason:
          type: string
    FlowDeliveryStatusObservation:
      type: object
      description: A fetched AppDeployer deployment state; RUNNING is not proof of service readiness or user
        SLO success.
      required:
      - observation_id
      - deployment_id
      - status
      - fetched_at
      - effective_updated_at
      - time_basis
      properties:
        observation_id:
          type: string
        deployment_id:
          type: string
        status:
          type: string
        source_updated_at:
          type: string
          description: Raw AppDeployer-declared status update time, including invalid or future values when provided.
        fetched_at:
          type: string
          format: date-time
          description: Local time the status was fetched.
        effective_updated_at:
          type: string
          format: date-time
          description: Time attached to the in-memory Agent Control status.
        time_basis:
          type: string
          enum:
          - source_updated_at
          - local_fetched_at
        fallback_reason:
          type: string
          enum:
          - source_updated_at_missing
          - source_updated_at_invalid
          - source_updated_at_future
    AgentProfile:
      type: object
      properties:
        name:
          type: string
        korean_name:
          type: string
        version:
          type: string
        role:
          type: string
        responsibilities:
          type: array
          items:
            type: string
        capabilities:
          type: array
          items:
            type: string
        bounded_actions:
          type: array
          items:
            type: string
        enabled:
          type: boolean
        endpoint:
          type: string
          format: uri
        invocation_path:
          type: string
        auth_token_env:
          type: string
          description: Environment variable name containing an optional bearer token. The token value is never
            returned.
        source:
          type: string
          enum:
          - configuration
          - runtime
    ErrorResponse:
      type: object
      required:
      - valid
      - message
      properties:
        valid:
          type: boolean
          example: false
        message:
          type: string
    ExternalAgentRegistrationRequest:
      type: object
      required:
      - name
      - version
      - role
      - endpoint
      - invocation_path
      - capabilities
      - bounded_actions
      properties:
        name:
          type: string
        korean_name:
          type: string
        version:
          type: string
        role:
          type: string
        responsibilities:
          type: array
          items:
            type: string
        endpoint:
          type: string
          format: uri
        invocation_path:
          type: string
          example: /v1/actions
        auth_token_env:
          type: string
          description: Optional environment variable name containing a bearer token.
        capabilities:
          type: array
          minItems: 1
          items:
            type: string
        bounded_actions:
          type: array
          minItems: 1
          items:
            type: string
        enabled:
          type: boolean
          default: true
    ReadinessResponse:
      type: object
      required:
      - status
      - service
      properties:
        status:
          type: string
          enum:
          - ready
          - not_ready
        service:
          type: string
          example: geon
    AgentControlReasoningComparisonRequest:
      type: object
      required:
      - candidate_id
      properties:
        candidate_id:
          type: string
          example: qwen3.5-ops-planner
